  menu() {
    if (this.busy) return;
    UI.modal(`<h3>メニュー</h3><div class="list">
      <button class="btn" data-a="help">遊び方</button><button class="btn" data-a="cfg">設定</button>
      <button class="btn" data-a="title">タイトルへ（記録は自動で残っています）</button><button class="btn y" data-a="close">とじる</button></div>`, {
      help: (d, b, m) => { m.close(); Game.help(); },
      cfg: (d, b, m) => { m.close(); Game.settings(); },
      title: (d, b, m) => { m.close(); Game.toTitle(); },
      close: (d, b, m) => m.close(),
    });
  },
  // ---------- actions ----------
  onTap(px, py) {
    if (this.busy || Dialog.active || UI.ovEl.querySelector('.modal')) return;
    const nd = this.nodes();
    let best = null, bd = 1e9;
    for (const k in nd) {
      if (!this.visible(k)) continue;
      const p = this.pos(nd[k]);
      const d = Math.hypot(p.x - px, p.y - py);
      if (d < bd) { bd = d; best = k; }
    }
    const lim = Math.max(this.cs * 2.2, 30 * View.dpr);
    if (!best || bd > lim) { if (this.focus) { this.focus = null; this.refresh(); } return; }
    const here = this.here(this.army);
    // tapping another army's location switches army
    if (this.kind === 'world' && Game.G.chapter < 4) {
      for (const k of ['A', 'B']) if (k !== this.army && Game.G.armies[k].node === best) { this.army = k; Game.G.cur = k; this.focus = null; Snd.sfx('sel'); this.refresh(); return; }
    }
    if (best === here) { this.focus = null; this.refresh(); return; }
    if (this.adj(here).includes(best) && this.routeOk(best)) {
      if (this.focus === best) { this.goFocus(); return; }
      this.focus = best; Snd.sfx('sel'); this.refresh(); return;
    }
    UI.toast(this.routeOk(best) ? 'となりの場所にしか進めません' : 'ここは、もう一方の隊が進む道です');
  },
  async goFocus() {
    const id = this.focus;
    if (!id || this.busy) return;
    this.busy = true;
    try { await this._goFocus(id); } finally { if (Scene === NodeMap) { this.busy = false; if (!Game.G || !Game.G.battle) this.refresh(); } }
  },
  async _goFocus(id) {
    const G = Game.G, a = this.army, n = this.nodes()[id];
    this.focus = null;
    if (this.kind === 'world') {
      const roam = this.roamAt(id);
      if ((n.map && !G.cleared[id]) || roam) {
        await this.walk(a, id);
        if (roam) return this.roamBattle(roam, a, id);
        Game.startBattle(MAPS[n.map], a, { type: 'node', node: id, moveTo: id });
        return;
      }
      await this.walk(a, id);
      Game.setArmyNode(a, id);
      G.day++;
      Game.save();
      await this.arrive(a, id);
      if (Game.G !== G || Scene !== NodeMap) return;
      if (!G.battle) await this.roamStep();
    } else {
      const dg = DUNGEONS[G.dungeon.id];
      if (n.t === 'boss' && !G.flags['dg.' + G.dungeon.id + '.' + id]) {
        await this.walk(a, id);
        Game.startBattle(MAPS[n.map], a, { type: 'dungeon', room: id, item: n.item, moveRoom: id });
        return;
      }
      await this.walk(a, id);
      G.dungeon.node = id; G.day++;
      const r = U.rngFrom((G.seed ^ (G.day * 7777 + id.length)) >>> 0);
      if (n.enc && r() < n.enc) {
        Game.save();
        Snd.sfx('door');
        await UI.banner('魔物が現れた！', 'e');
        const md = Game.makeEncounter(U.pick(dg.enc, r), dg.pool, dg.lv + (r() < 0.4 ? 1 : 0), 4 + Math.floor(r() * 3), a, null, dg.n);
        Game.startBattle(md, a, { type: 'dungeon', room: null });
        return;
      }
      const key = 'dg.' + G.dungeon.id + '.' + id;
      if (n.t === 'chest' && !G.flags[key]) {
        G.flags[key] = true;
        G.inv[a === 'AB' ? 'A' : a].items.push(n.item);
        Game.save();
        Snd.sfx('get');
        await UI.alert(`宝箱を開けた。<br><span class="yel">${ITEM[n.item].n}</span>を手に入れた！<br><span class="small dim">${ITEM[n.item].d}</span>`);
      } else Game.save();
      if (n.t === 'spring' && !G.flags[key]) { this.busy = false; this.refresh(); this.spring(id); }
    }
  },
  walk(a, id) {
    const from = this.nodes()[this.here(a)], to = this.nodes()[id];
    return new Promise(res => {
      if (Time.speed === 0) { res(); return; }
      const t0 = performance.now(), dur = 420 / Time.speed;
      Snd.sfx('step');
      const step = now => {
        const p = Math.min(1, (now - t0) / dur);
        this.tok = { a, x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p };
        if (p < 1) requestAnimationFrame(step); else { this.tok = null; res(); }
      };
      requestAnimationFrame(step);
    });
  },
  async arrive(a, id) {
    const G = Game.G, n = WORLD.nodes[id];
    if ((n.t === 'village' || n.t === 'town') && n.ev && !G.visited[id]) {
      const ev = EVENTS[n.ev];
      // if the page is closed during the scene, it plays again on the next load
      G.pendingArrive = { a, id };
      Game.save();
      if (ev) await Dialog.play(ev.lines, { also: (ev.join || []).filter(j => !G.units[j]) });
      if (Game.G !== G || Scene !== NodeMap) return; // left the game during the dialogue: nothing granted, the visit stays open
      G.pendingArrive = null;
      const army = a === 'AB' ? 'A' : a;
      const msgs = [];
      G.visited[id] = true;
      if (ev) {
        for (const j of ev.join || []) if (!G.units[j]) { Game.join(j, army); msgs.push(`<span class="yel">${CHAR[j].n}</span>が仲間になった！<br><span class="small dim">${CLS[CHAR[j].cls].n} Lv${CHAR[j].lv}</span>`); }
        for (const it of ev.items || []) { G.inv[army].items.push(it); msgs.push(`<span class="yel">${ITEM[it].n}</span>を手に入れた！<br><span class="small dim">${ITEM[it].d}</span>`); }
        if (ev.herb) { G.inv[army].herb += ev.herb; msgs.push(`薬草を${ev.herb}つ手に入れた！`); }
      }
      Game.save();
      for (const m of msgs) { Snd.sfx('get'); await UI.alert(m); }
    }
    if (n.t === 'shrine' && Scene === NodeMap) Game.shrine(id, a);
  },
  async roamStep() {
    const G = Game.G;
    const r = U.rngFrom((G.seed + G.day * 31337) >>> 0);
    for (const grp of G.roam.slice()) {
      const targets = ['A', 'B'].filter(k => k === grp.r);
      if (!targets.length) continue;
      const goal = G.armies[targets[0]].node;
      // BFS on visible nodes of the same route
      const prev = { [grp.node]: null }, q = [grp.node];
      while (q.length) {
        const c = q.shift();
        if (c === goal) break;
        for (const nb of WORLD.adj(c)) if (!(nb in prev) && this.visible(nb) && WORLD.nodes[nb].r === grp.r && !(WORLD.nodes[nb].map && !G.cleared[nb] && nb !== goal)) { prev[nb] = c; q.push(nb); }
      }
      if (!(goal in prev)) continue;
      let p = goal, steps = 0;
      while (prev[p] && prev[p] !== grp.node) { p = prev[p]; steps++; }
      if (steps > 3 || r() > 0.55) continue;
      grp.node = p;
      if (p === goal) {
        Game.save();
        Snd.sfx('door');
        await UI.banner(`${grp.n}が襲ってきた！`, 'e');
        this.roamBattle(grp, targets[0], p);
        return;
      }
    }
    // respawn
    for (const k of ['A', 'B']) {
      const key = 'roamCd' + k;
      if (G.roam.some(g => g.r === k) || !G.roamSpawn || !G.roamSpawn[k]) continue;
      G.flags[key] = (G.flags[key] || 0) + 1;
      if (G.flags[key] >= 6) {
        const spots = G.roamSpawn[k].filter(s => G.armies[k].node !== s && this.visible(s) && !(WORLD.nodes[s].ev && !G.visited[s]));
        if (spots.length) { G.flags[key] = 0; const t = G.roamTpl[k]; G.roam.push(Object.assign({ id: 'r' + k + G.day, node: U.pick(spots, r), r: k }, t)); }
      }
    }
    Game.save();
  },
  setNode(a, id) { Game.setArmyNode(a, id); },
  roamBattle(grp, a, node) {
    const G = Game.G;
    const r = U.rngFrom((G.seed + G.day * 97) >>> 0);
    const md = Game.makeEncounter(r() < 0.5 ? 'field_a' : 'field_b', grp.pool, grp.lv, 4 + Math.floor(r() * 2) + (G.chapter > 1 ? 1 : 0), a, null, grp.n);
    Game.startBattle(md, a, { type: 'roam', id: grp.id, moveTo: node });
  },
  enterDungeon(id) {
    const G = Game.G;
    const n = WORLD.nodes[id];
    G.dungeon = { id: n.dg, node: 'in', army: this.army, from: id };
    Game.save();
    go(NodeMap, 'dungeon');
  },
  leaveDungeon() { const G = Game.G; G.dungeon = null; Game.save(); go(NodeMap, 'world'); },
  async spring(id) {
    const G = Game.G;
    const n = this.nodes()[id];
    const key = 'dg.' + G.dungeon.id + '.' + id;
    if (G.flags[key] || this.springOpen) return;
    this.springOpen = true;
    const units = Game.armyUnits(this.army);
    const sk = n.stat === 'hp' ? 'mhp' : n.stat, amt = n.stat === 'hp' ? 4 : 2;
    const room = v => Math.max(0, Math.min(amt, R.cap(v, n.stat) - v[sk]));
    const u = await UI.choose(`${n.n}：だれが飲む？（1人だけ・${SN[n.stat]}+${amt}）`, units.map(v => ({ t: `${v.n}（${SN[n.stat]} ${v[sk]}${room(v) ? '' : '・上限'}）`, v })));
    this.springOpen = false;
    if (!u || G.flags[key] || Game.G !== G) return;
    const add = room(u);
    if (!add) { await UI.alert(`${U.esc(u.n)}の${SN[n.stat]}はもう上限です。<br>ほかの仲間を選びましょう。`); return; }
    u[sk] += add;
    if (sk === 'mhp') u.hp = u.mhp;
    G.flags[key] = true;
    Snd.sfx('lvup');
    await UI.alert(`${U.esc(u.n)}の${SN[n.stat]}が${add}上がった！`);
    Game.save();
    this.refresh();
  },
  // ---------- drawing ----------
  draw(ctx, t) {
    const G = Game.G;
    if (!G) return;
    const d = this.def(), cs = this.cs;
    ctx.fillStyle = this.kind === 'world' ? '#1e4a9a' : '#120c0a';
    ctx.fillRect(0, 0, View.W, View.H);
    ctx.drawImage(this.img, -this.cam.x, -this.cam.y, d.w * cs, d.h * cs);
    const nd = this.nodes();
    // fog
    if (this.kind === 'world') {
      const fr = WORLD.fogRow[Math.max(1, Math.min(4, G.chapter))] - (EDITION === 'trial' ? 0 : 0);
      const fogY = (EDITION === 'trial' ? WORLD.fogRow[1] : fr) * cs - this.cam.y;
      if (fogY < View.H) {
        const gr = ctx.createLinearGradient(0, fogY - cs * 2, 0, fogY + cs * 2);
        gr.addColorStop(0, 'rgba(40,30,70,0)'); gr.addColorStop(1, 'rgba(40,30,70,0.82)');
        ctx.fillStyle = gr; ctx.fillRect(0, fogY - cs * 2, View.W, cs * 4);
        ctx.fillStyle = 'rgba(40,30,70,0.82)'; ctx.fillRect(0, fogY + cs * 2, View.W, View.H);
        for (let i = 0; i < 14; i++) {
          const fx = ((i * 97 + t * 0.012 * (i % 3 + 1)) % (View.W + 200)) - 100, fy = fogY + (i * 53 % 400) / 400 * (View.H - fogY + cs * 4) - cs;
          ctx.fillStyle = 'rgba(120,100,170,0.10)'; ctx.beginPath(); ctx.ellipse(fx, fy, cs * 4, cs * 1.2, 0, 0, 7); ctx.fill();
        }
      }
    }
    // edges
    ctx.lineCap = 'round';
    for (const [a, b] of d.edges) {
      const ga = this.ghost(a) || this.ghost(b);
      if (this.kind === 'world' && (!this.visible(a) && !this.visible(b)) && EDITION === 'full') continue;
      const A = this.pos(nd[a]), B = this.pos(nd[b]);
      ctx.strokeStyle = ga ? 'rgba(220,200,150,0.25)' : (this.kind === 'world' ? '#e8d49a' : '#c8b08a');
      ctx.lineWidth = Math.max(2, cs * 0.18);
      ctx.setLineDash(this.kind === 'world' ? [cs * 0.35, cs * 0.25] : []);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
    ctx.setLineDash([]);
    const here = this.here(this.army);
    const adj = this.busy ? [] : this.adj(here).filter(k => this.routeOk(k));
    // nodes
    const isz = Math.max(16, cs * (this.kind === 'world' ? 1.85 : 1.5));
    ctx.textAlign = 'center';
    for (const k in nd) {
      const n = nd[k];
      if (this.kind === 'world' && !this.visible(k) && EDITION === 'full' && n.ch > G.chapter + 1) continue;
      const p = this.pos(n);
      if (p.y < -isz * 2 || p.y > View.H + isz * 2) continue;
      const ghost = this.ghost(k);
      ctx.globalAlpha = ghost ? 0.35 : 1;
      if (adj.includes(k)) {
        const pr = 0.75 + 0.25 * Math.sin(t / 200);
        ctx.fillStyle = `rgba(255,216,74,${0.35 * pr})`; ctx.beginPath(); ctx.arc(p.x, p.y, isz * 0.75, 0, 7); ctx.fill();
        ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = Math.max(2, cs * 0.12); ctx.beginPath(); ctx.arc(p.x, p.y, isz * 0.7 * pr, 0, 7); ctx.stroke();
      }
      if (this.focus === k) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, cs * 0.16); ctx.beginPath(); ctx.arc(p.x, p.y, isz * 0.8, 0, 7); ctx.stroke(); }
      let ic = n.t;
      if (this.kind === 'world' && n.t === 'battle' && G.cleared[k]) ic = 'flag';
      if (this.kind === 'dungeon' && (n.t === 'chest' || n.t === 'boss') && G.flags['dg.' + G.dungeon.id + '.' + k]) ic = n.t === 'boss' ? 'flag' : 'path';
      if (this.kind === 'world' && n.map && !G.cleared[k] && !ghost) { ctx.fillStyle = 'rgba(200,40,40,0.75)'; ctx.beginPath(); ctx.arc(p.x, p.y, isz * 0.48, 0, 7); ctx.fill(); }
      ctx.drawImage(Icon.get(ic), p.x - isz / 2, p.y - isz / 2, isz, isz * 13 / 14);
      if (cs >= 9 || this.kind === 'dungeon') {
        const fs = Math.round(Math.max(10 * View.dpr, Math.min(cs * 0.75, 13 * View.dpr)));
        ctx.font = `${fs}px DotGothic16, sans-serif`;
        ctx.lineWidth = Math.max(2, fs / 4); ctx.strokeStyle = 'rgba(0,0,20,0.85)';
        // a few labels sit beside their icon so they do not run into a neighbour's
        const side = n.lab === 'left' ? -1 : n.lab === 'right' ? 1 : 0;
        const lx = p.x + side * isz * 0.62, ly = side ? p.y + fs * 0.36 : p.y + isz * 0.5 + fs;
        ctx.textAlign = side < 0 ? 'right' : side > 0 ? 'left' : 'center';
        ctx.strokeText(n.n, lx, ly);
        ctx.fillStyle = ghost ? '#c8c0e0' : '#ffffff'; ctx.fillText(n.n, lx, ly);
        ctx.textAlign = 'center';
      }
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'left';
    // roaming groups
    if (this.kind === 'world') {
      for (const g of G.roam) {
        if (!this.visible(g.node)) continue;
        const p = this.pos(nd[g.node]);
        const s = isz * 1.05, b = Math.floor(t / 400) % 2;
        ctx.fillStyle = 'rgba(255,40,40,0.5)'; ctx.beginPath(); ctx.ellipse(p.x + s * 0.45, p.y + s * 0.15, s * 0.4, s * 0.12, 0, 0, 7); ctx.fill();
        ctx.drawImage(SP.get(g.sp || 'wolf', 'E', null, { flip: true }), p.x, p.y - s * 0.75 - (b ? 2 : 0), s, s);
      }
    }
    // army tokens
    const armies = this.kind === 'world' ? (G.chapter >= 4 ? ['AB'] : ['A', 'B']) : [this.army];
    for (const a of armies) {
      const nodeId = this.kind === 'world' ? G.armies[a === 'AB' ? 'A' : a].node : G.dungeon.node;
      let n = nd[nodeId];
      if (this.tok && this.tok.a === a) n = { x: this.tok.x, y: this.tok.y };
      const p = this.pos(n);
      const s = isz * 1.2;
      const lead = a === 'B' ? Game.G.units.rise : Game.G.units.kai;
      const sel = a === this.army;
      const bob = sel ? (Math.floor(t / 300) % 2) * Math.max(1, cs * 0.08) : 0;
      if (sel) { ctx.fillStyle = 'rgba(90,160,255,0.55)'; ctx.beginPath(); ctx.ellipse(p.x - s * 0.1, p.y + s * 0.05, s * 0.45, s * 0.14, 0, 0, 7); ctx.fill(); }
      ctx.globalAlpha = sel ? 1 : 0.85;
      ctx.drawImage(SP.get(CLS[lead.cls].sp, 'P', lead.hair, { gray: !sel }), p.x - s * 0.6, p.y - s * 0.95 - bob, s, s);
      if (a === 'AB') { const r2 = Game.G.units.rise; ctx.drawImage(SP.get(CLS[r2.cls].sp, 'P', r2.hair), p.x - s * 0.1, p.y - s * 0.9 - bob, s, s); }
      ctx.globalAlpha = 1;
    }
    if (this.kind === 'world' && this.maxY > 0) {
      const h = View.H * View.H / (View.H + this.maxY), y = (View.H - h) * (this.cam.y / this.maxY);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(View.W - 4 * View.dpr, y, 3 * View.dpr, h);
    }
  },
};

// ===================== backgrounds, story, title, trial end =====================
const BG = {
  c: null, w: 0, h: 0,
  draw(ctx, kind, t) {
    const W = 128, H = Math.max(160, Math.round(W * View.H / View.W));
    if (!BG.c || BG.w !== W || BG.h !== H) { BG.c = SP.canvas(W, H); BG.w = W; BG.h = H; }
    const x = BG.c.getContext('2d');
    const P = (col, a, b, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), w, h); };
    const hz = Math.round(H * 0.6);
    const lit = kind === 'title' || kind === 'light';
    // sky
    const sky = x.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, '#05071a'); sky.addColorStop(0.7, '#140f36'); sky.addColorStop(1, lit ? '#3a2a5a' : '#2a1a46');
    x.fillStyle = sky; x.fillRect(0, 0, W, hz);
    for (let i = 0; i < 46; i++) { const h = Tiles.hash(i, 3, 11); const sx = h % W, sy = (h >> 8) % (hz - 10); if (((t / 600 + i) | 0) % 7) P(i % 5 ? '#c8d0ff' : '#ffffff', sx, sy); }
    // moon
    x.fillStyle = '#f6eec8'; x.beginPath(); x.arc(24, 22, 7, 0, 7); x.fill(); x.fillStyle = '#0e0c2a'; x.beginPath(); x.arc(27, 20, 6, 0, 7); x.fill();
    // sea
    const sea = x.createLinearGradient(0, hz, 0, H);
    sea.addColorStop(0, '#16224e'); sea.addColorStop(1, '#070a20');
    x.fillStyle = sea; x.fillRect(0, hz, W, H - hz);
    for (let i = 0; i < 26; i++) { const h = Tiles.hash(i, 9, 2); const wy = hz + 3 + (h % (H - hz - 4)); const wx = ((h >> 4) % W + t * 0.004 * (1 + i % 3)) % (W + 10) - 10; P('#2e4482', wx, wy, 4 + (h % 6), 1); }
    // cliff + lighthouse
    x.fillStyle = '#0a0a18';
    x.beginPath(); x.moveTo(70, hz + 1); x.lineTo(84, hz - 10); x.lineTo(102, hz - 14); x.lineTo(116, hz - 9); x.lineTo(128, hz - 6); x.lineTo(128, hz + 1); x.fill();
    const lx = 100, ly = hz - 14;
    for (let i = 0; i < 18; i++) P(i % 6 < 3 ? '#d8d8e8' : '#b83a3a', lx - 2, ly - i - 1, 5, 1);
    P('#2a2a3a', lx - 3, ly - 20, 7, 2);
    P(lit ? '#fff2a0' : '#3a3a50', lx - 2, ly - 23, 5, 3);
    P('#2a2a3a', lx - 3, ly - 25, 7, 2); P('#2a2a3a', lx - 1, ly - 27, 3, 2);
    if (lit) {
      const a = Math.sin(t / 1400);
      const len = 90 * Math.abs(a) + 10, spread = 6 + 4 * (1 - Math.abs(a));
      const dir = a > 0 ? -1 : 1;
      const gr = x.createLinearGradient(lx, 0, lx + dir * len, 0);
      gr.addColorStop(0, 'rgba(255,240,160,0.75)'); gr.addColorStop(1, 'rgba(255,240,160,0)');
      x.fillStyle = gr; x.beginPath(); x.moveTo(lx, ly - 22); x.lineTo(lx + dir * len, ly - 22 - spread); x.lineTo(lx + dir * len, ly - 22 + spread); x.fill();
      x.fillStyle = 'rgba(255,240,160,0.25)'; x.beginPath(); x.arc(lx, ly - 22, 6, 0, 7); x.fill();
      for (let i = 0; i < 12; i++) P('rgba(255,230,150,0.35)', lx - 2 + Math.sin(t / 300 + i) * 2, hz + 2 + i * 3, 3 + (i % 3), 1);
    }
    // mist
    for (let i = 0; i < 9; i++) {
      const h = Tiles.hash(i, 5, 7);
      const mx = ((h % W) + t * 0.003 * (1 + i % 2)) % (W + 60) - 30, my = hz - 8 + (h >> 6) % 30;
      x.fillStyle = lit ? 'rgba(130,110,180,0.10)' : 'rgba(120,96,170,0.18)';
      x.beginPath(); x.ellipse(mx, my, 22 + i % 4 * 5, 4, 0, 0, 7); x.fill();
    }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(BG.c, 0, 0, View.W, View.H);
  },
};

// ---- moving a record to another browser / device as a text code ----
const SaveCode = {
  b64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  unb64(t) { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; const s = atob(t); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; },
  async pipe(bytes, Stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Stream('gzip'))).arrayBuffer()); },
  async make(rec) {
    const json = new TextEncoder().encode(JSON.stringify({ app: 'futatsu-akari', v: 1, rec }));
    if (typeof CompressionStream !== 'undefined') { try { return 'FA1.' + SaveCode.b64(await SaveCode.pipe(json, CompressionStream)); } catch (e) { /* plain code below */ } }
    return 'FA0.' + SaveCode.b64(json);
  },
  async read(text) {
    const m = /FA([01])\.([A-Za-z0-9_-]{16,})/.exec(String(text || '').replace(/\s+/g, ''));
    if (!m) throw new Error('form');
    let bytes = SaveCode.unb64(m[2]);
    if (m[1] === '1') { if (typeof DecompressionStream === 'undefined') throw new Error('nozip'); bytes = await SaveCode.pipe(bytes, DecompressionStream); }
    const o = JSON.parse(new TextDecoder().decode(bytes));
    const v = o && o.app === 'futatsu-akari' ? o.rec : null;
    if (!(v && typeof v === 'object' && v.G && typeof v.G === 'object' && v.G.units && v.meta && typeof v.meta === 'object')) throw new Error('form');
    return v;
  },
};

  enter() {
    document.getElementById('top').style.display = 'none';

    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-t]');
      if (!b || b.disabled) return;
      Snd.unlock(); Snd.sfx('tick');
      if (Snd.cur !== 'title') Snd.bgm('title');

  exit() { document.getElementById('top').style.display = ''; },
  draw(ctx, t) { BG.draw(ctx, 'title', t); },
  async pickSlot(isNew) {
    const slots = Game.slots();
    const items = slots.map((s, i) => {
      if (!s) return { t: `記録${i + 1}　<span class="dim">（空き）</span>`, v: i, dis: !isNew };
      const m = s.meta;
      if (!Game.canOpen(s)) return { t: `記録${i + 1}　完全版の記録`, d: '体験版では開けません（上書きもできません）', v: i, dis: true };
      return { t: `記録${i + 1}　${U.esc(m.where || '')}`, d: `${m.day}日目・${m.mode === 'classic' ? 'クラシック' : 'カジュアル'}・プレイ時間 ${U.fmtTime(m.time)}${m.ed === 'trial' && EDITION === 'full' ? '・体験版の記録' : ''}`, v: i };
    });
    const i = await UI.choose(isNew ? 'どの記録に始める？' : 'どの記録から続ける？', items);
    if (i === null || i === undefined) return;
    if (!isNew) { Game.load(i); return; }
    if (slots[i] && !(await UI.confirm(`記録${i + 1}を上書きして、はじめから始めますか？`, '上書きする', 'やめる'))) return;
    const mode = await UI.choose('遊び方を選んでください', [
      { t: 'カジュアル', d: '倒れた仲間も、戦闘のあとに戻ってきます。はじめての方におすすめ。', v: 'casual', cls: 'y' },
      { t: 'クラシック', d: '倒れた仲間は戻りません。昔ながらの緊張感で遊びたい方に。', v: 'classic' },

  },
  slotLine(s, i) { return { t: `記録${i + 1}　${U.esc(s.meta.where || '')}`, d: `${s.meta.day}日目・プレイ時間 ${U.fmtTime(s.meta.time)}` }; },
  async transfer() {
    const k = await UI.choose('記録を移す', [
      { t: 'コードを作る', d: 'この記録を文字のコードにします（移す元で）', v: 'out' },
      { t: 'コードを入れる', d: 'コードから記録を読み込みます（移す先で）', v: 'in' },
    ], { text: '記録は、このブラウザの中にだけ残ります。別のブラウザや端末で続けたいときは、記録を文字のコードにして移します。' });
    if (k === 'out') Title.exportFlow();
    if (k === 'in') Title.importFlow();
  },
  async exportFlow() {
    const slots = Game.slots();
    const i = await UI.choose('どの記録をコードにする？', slots.map((s, n) => s ? Object.assign(Title.slotLine(s, n), { v: n }) : { t: `記録${n + 1}　<span class="dim">（空き）</span>`, v: n, dis: true }));
    if (i === null || i === undefined) return;
    let code = '';
    try { code = await SaveCode.make(slots[i]); } catch (e) { await UI.alert('コードを作れませんでした。'); return; }
    UI.modal(`<h3>記録${i + 1}のコード</h3><p class="small">「コピーする」を押して、移す先のブラウザや端末で、タイトルの「記録を移す」→「コードを入れる」に貼り付けてください。</p>
      <textarea class="code" rows="5" readonly>${code}</textarea>
      <p class="small dim">${code.length.toLocaleString()}文字。このコードを渡すと、ほかの人もこの記録の続きを遊べます。</p>
      <div class="row end"><button class="btn" data-a="ok">とじる</button><button class="btn y" data-a="copy">コピーする</button></div>`, {
      copy: async (d, b, m) => { const ok = await Title.copy(code, m.el.querySelector('textarea')); b.textContent = ok ? 'コピーしました' : '長押しでコピーしてください'; },
      ok: (d, b, m) => m.close(),
    });
  },
  async copy(text, ta) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* fall back to selecting the text */ }
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); return document.execCommand('copy'); } catch (e) { return false; }
  },
  async importFlow() {
    const text = await new Promise(res => {
      let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      UI.modal(`<h3>コードを入れる</h3><p class="small">移す元で作ったコードを、下に貼り付けてください。</p>
        <textarea class="code" rows="5" placeholder="FA1. から始まるコード" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <div class="row end"><button class="btn" data-a="no">やめる</button><button class="btn y" data-a="go">読み込む</button></div>`, {
        go: (d, b, m) => { const v = m.el.querySelector('textarea').value; fin(v); m.close(); },
        no: (d, b, m) => { fin(null); m.close(); },
      }, { onClose: () => fin(null), dismiss: false });
    });
    if (!text || !text.trim()) return;
    let rec;
    try { rec = await SaveCode.read(text); } catch (e) {
      await UI.alert(e.message === 'nozip' ? 'このブラウザでは、このコードを読み込めません。<br>新しいブラウザで開いてください。' : 'コードを読み込めませんでした。<br>最後まで貼り付けられているか、確かめてください。');
      return;
    }
    if (!Game.canOpen(rec)) { await UI.alert('これは完全版の記録です。<br>体験版では読み込めません。'); return; }
    const slots = Game.slots();
    const items = slots.map((s, n) => {
      if (!s) return { t: `記録${n + 1}　<span class="dim">（空き）</span>`, v: n };
      if (!Game.canOpen(s)) return { t: `記録${n + 1}　完全版の記録`, d: '体験版では上書きできません', v: n, dis: true };
      const l = Title.slotLine(s, n); l.d = '上書きされます（' + l.d + '）'; l.v = n; return l;
    });
    const i = await UI.choose('どこに入れる？', items, { text: `読み込む記録：${U.esc(rec.meta.where || '')}・${rec.meta.day}日目・プレイ時間 ${U.fmtTime(rec.meta.time)}` });
    if (i === null || i === undefined) return;
    if (slots[i] && !(await UI.confirm(`記録${i + 1}を上書きしますか？`, '上書きする', 'やめる'))) return;
    const now = Game.slots(); now[i] = rec;
    if (!Store.set(SAVE_KEY, now)) { await UI.alert('このブラウザでは、記録を保存できませんでした。'); return; }
    Snd.sfx('get');
    await UI.alert(`記録${i + 1}に読み込みました。<br>「つづきから」で続きを遊べます。`);
    if (Scene === Title) go(Title);
  },
};

    const Rr = [[0, 38], [8, 38], [14, 37.5], [20, 37], [26, 36.5], [32, 36], [38, 35], [44, 32], [49, 28], [54, 24.5], [58, 22], [59, 20.5]];
    const n2 = (x, y) => { const h = Tiles.hash(x, y, 99); return (h % 1000) / 1000; };
    const smooth = (x, y, s) => { const xi = Math.floor(x / s), yi = Math.floor(y / s); const fx = x / s - xi, fy = y / s - yi; const a = n2(xi, yi), b = n2(xi + 1, yi), c = n2(xi, yi + 1), d = n2(xi + 1, yi + 1); return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy; };
    const g = [];
    for (let y = 0; y < H; y++) {
      const row = [];
      for (let x = 0; x < W; x++) {
        const l = lerp(L, y) + (smooth(x, y, 3) - 0.5) * 2.4, r = lerp(Rr, y) + (smooth(x + 50, y, 3) - 0.5) * 2.4;
        let c = (x < l || x > r) ? '~' : '.';
        if (c === '.') {
          const e = (cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
          const nn = smooth(x, y, 2);
          if (e(31, 8, 7.5, 6) < 1 + (nn - 0.5) * 0.6) c = e(31, 8, 4, 3) < 1 ? 'M' : '^';
          if (e(19, 25, 3.2, 10) < 1 + (nn - 0.5) * 0.7) c = e(19, 25, 1.4, 6) < 1 ? 'M' : '^';
          if (e(20, 37, 2.6, 5) < 1 + (nn - 0.5) * 0.6) c = '^';
          if (e(33, 25, 3, 2.5) < 1) c = '^';
          if (c === '.' && (e(30, 31, 5, 4) < 1 + (nn - 0.5) * 0.8 || e(12, 7, 4, 2.5) < 1 || e(22, 14, 4, 3) < 1 + (nn - 0.5) || e(9, 31, 3, 2.5) < 1 || e(26, 44, 3, 2.5) < 1 || e(14, 41, 2.5, 2) < 1)) c = 'T';
          if (c === '.' && smooth(x + 9, y + 3, 1.5) > 0.86) c = 'T';
          if (e(16, 50, 3, 1.5) < 1 && c === '.') c = 'T';
        }
        row.push(c);
      }
      g.push(row);
    }
    // bay near Kamome & a lake in the old capital plain
    const sea = (x, y) => { if (g[y] && g[y][x]) g[y][x] = '~'; };
    for (let y = 19; y <= 22; y++) for (let x = 2; x <= 3; x++) sea(x, y);
    for (let y = 46; y <= 48; y++) for (let x = 17; x <= 19; x++) sea(x, y);
    // keep node cells walkable-looking
    for (const k in WORLD.nodes) { const n = WORLD.nodes[k]; if (g[n.y][n.x] === '~' || g[n.y][n.x] === 'M') g[n.y][n.x] = '.'; }
    WORLD.terrain = g;
    return g;
  },
  adj(id) {
    const out = [];
    for (const [a, b] of WORLD.edges) { if (a === id) out.push(b); else if (b === id) out.push(a); }
    return out;
  },
};
