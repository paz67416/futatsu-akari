<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);

body{overflow:hidden;touch-action:manipulation}
#game{position:relative;width:100%;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#000}

#top .tl small{color:var(--dim);font-size:11px;display:block}
#top .tm{color:var(--yel);white-space:nowrap;font-size:13px;text-align:right}
#top button{flex:0 0 auto}
#view{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#panel{flex:0 0 auto;min-height:0;max-height:46vh;overflow-y:auto;padding:6px;background:linear-gradient(#0e1644,#070b26);border-top:2px solid #2c3890;font-size:14px;z-index:5;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
#panel:empty{display:none}
#ov{position:absolute;inset:0;pointer-events:none;z-index:20}
#ov>*{pointer-events:auto}
.win{background:linear-gradient(var(--win),var(--win2));border:2px solid var(--line);border-radius:6px;box-shadow:inset 0 0 0 2px var(--line2),0 3px 0 rgba(0,0,0,.6);padding:8px 10px}
.btn{font-family:var(--font);font-size:15px;color:var(--text);background:linear-gradient(#26348a,#151d5a);border:2px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px;box-shadow:inset 0 0 0 1px var(--line2),0 2px 0 #000;cursor:pointer;line-height:1.1;touch-action:manipulation}
.btn:active{transform:translateY(1px);filter:brightness(1.25)}
.btn.sm{font-size:13px;padding:5px 8px;min-height:32px}
.btn.y{color:#1c1400;background:linear-gradient(#ffe27a,#d8a822);border-color:#fff4c0;box-shadow:inset 0 0 0 1px #8a6a10,0 2px 0 #000}
.btn.r{background:linear-gradient(#8a2630,#561018)}
.btn.g{background:linear-gradient(#1e6a3c,#0e4024)}
.btn:disabled{opacity:.4;filter:grayscale(1)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.acts .btn{padding:6px 2px;font-size:14px}
.dim{color:var(--dim)}
.yel{color:var(--yel)}.red{color:var(--red)}.blu{color:var(--blue)}.grn{color:var(--green)}.pur{color:var(--pur)}
.small{font-size:12px}
.hpbar{position:relative;height:8px;background:#2a0e14;border:1px solid #000;border-radius:2px;overflow:hidden;margin:2px 0}

.skip{position:absolute;right:8px;top:8px}

.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:92%;text-align:center;font-size:14px;pointer-events:none;animation:tfade 2.4s forwards}

.title-menu{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;gap:10px}

  rngFrom(seed) {
    let s = (seed >>> 0) || 1;
    const f = () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.get = () => s;
    f.set = v => { s = v | 0; };
    return f;
  },
  pick(arr, r) { return arr[Math.floor((r || Math.random)() * arr.length)]; },
  shuffle(arr, r) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor((r || Math.random)() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  },
  clone: o => JSON.parse(JSON.stringify(o)),
  key: (x, y) => x + ',' + y,
  dist: (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y),
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  now: () => (typeof performance !== 'undefined' ? performance.now() : Date.now()),
  fmtTime(sec) {
    sec = Math.floor(sec || 0);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);

  },
};

  get(k, def) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }

  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },

const SP = {
  cache: new Map(),
  rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
  shade(hex, f) { const [r, g, b] = SP.rgb(hex); const c = v => U.clamp(Math.round(v * f), 0, 255).toString(16).padStart(2, '0'); return '#' + c(r) + c(g) + c(b); },
  canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  // compose a recipe into a 16x16 char grid
  grid(key) {
    const g = [];
    for (let y = 0; y < 16; y++) g.push(new Array(16).fill('.'));
    if (SPR_RAW[key]) {
      SPR_RAW[key].forEach((row, y) => { for (let x = 0; x < 16; x++) g[y][x] = row[x] || '.'; });
      return g;
    }
    const rec = SPR[key];
    if (!rec) return g;
    for (const [pn, ox, oy] of rec.L) {
      const part = PARTS[pn];
      part.forEach((row, py) => {
        for (let px = 0; px < row.length; px++) {
          const ch = row[px];
          if (ch === '.') continue;
          const X = ox + px, Y = oy + py;
          if (X >= 0 && X < 16 && Y >= 0 && Y < 16) g[Y][X] = ch;
        }
      });
    }
    return g;
  },
  outline(g) {
    const out = g.map(r => r.slice());
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if (g[y][x] !== '.') continue;
      const n = (yy, xx) => yy >= 0 && yy < 16 && xx >= 0 && xx < 16 && g[yy][xx] !== '.';
      if (n(y - 1, x) || n(y + 1, x) || n(y, x - 1) || n(y, x + 1)) out[y][x] = 'k';
    }
    return out;
  },
  // get sprite canvas. team P/E/N, hair hex, flags: gray, flip
  get(key, team = 'P', hair = null, opt = {}) {
    const ck = [key, team, hair, opt.gray ? 1 : 0, opt.flip ? 1 : 0, opt.white ? 1 : 0].join('|');
    if (SP.cache.has(ck)) return SP.cache.get(ck);
    const rec = SPR[key] || {};
    const pal = Object.assign({}, PAL, TEAM[team] || TEAM.P, rec.pal || {});
    if (rec.hood === 'team') { pal.u = pal.c; pal.U = pal.C; }
    const hc = hair || '#6a4a2a';
    pal.h = hc; pal.H = SP.shade(hc, 0.68);
    // enemy humans: tint gold/metal accents slightly? keep. Monsters get team-tinted outline for readability
    if (team === 'E' && (SPR_RAW[key] || ['ghoul', 'skel', 'skelA', 'shaman', 'dknight'].includes(key))) pal.k = '#4a0c14';
    const g = SP.outline(SP.grid(key));
    const c = SP.canvas(16, 16), x = c.getContext('2d');
    const img = x.createImageData(16, 16);
    for (let y = 0; y < 16; y++) for (let xx = 0; xx < 16; xx++) {
      const ch = g[y][opt.flip ? 15 - xx : xx];
      if (ch === '.') continue;
      let col = pal[ch] || '#ff00ff';
      let [r, gg, b] = SP.rgb(col);
      if (opt.gray) { const l = Math.round(r * 0.3 + gg * 0.55 + b * 0.15); r = gg = b = Math.round(l * 0.7 + 30); }
      if (opt.white) { r = gg = b = 255; }
      const i = (y * 16 + xx) * 4;
      img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    SP.cache.set(ck, c);
    return c;
  },
};

// ===================== terrain tiles (procedural pixel art) =====================
const TILESTYLE = {
  field: { floor: ['#8a8070', '#7a7062', '#9a907e'], wall: ['#6a6058', '#4a423c', '#857a70'] },
  indoor: { floor: ['#7a6a5a', '#6a5a4c', '#8a7a68'], wall: ['#5a5a6e', '#3e3e52', '#76768c'] },
  cave: { floor: ['#5a4a3e', '#4a3c32', '#6a5848'], wall: ['#3a2e28', '#241c18', '#54443a'] },
  crypt: { floor: ['#4a4a5e', '#3c3c4e', '#5a5a70'], wall: ['#2e2a40', '#1c1a2a', '#463e5e'] },
  tower: { floor: ['#d0ccc0', '#b8b4a8', '#e0dcd0'], wall: ['#8a8890', '#6a6872', '#a8a6b0'] },
};
const Tiles = {
  cache: new Map(),
  mask(grid, x, y) {
    const ch = grid[y][x];
    const get = (xx, yy) => (grid[yy] && grid[yy][xx]) || null;
    const nb = [[0, -1, 1], [1, 0, 2], [0, 1, 4], [-1, 0, 8]];
    let m = 0;
    if (ch === '~' || ch === 'R') { for (const [dx, dy, b] of nb) { const n = get(x + dx, y + dy); if (n && n !== '~' && n !== 'R' && n !== '=') m |= b; } }
    else if (ch === 'r') { for (const [dx, dy, b] of nb) { const n = get(x + dx, y + dy); if (n && 'r=VvFGS'.includes(n)) m |= b; } }
    return m;
  },
  hash(x, y, s) { let h = (x * 374761393 + y * 668265263 + (s || 0) * 1274126177) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0); },
  get(ch, x, y, style, mask, frame) {
    const v = Tiles.hash(x, y, 7) % 4;
    const ck = ch + v + style + (mask | 0) + ((ch === '~' || ch === 'R' || ch === 'x') ? (frame | 0) : 0);
    let c = Tiles.cache.get(ck);
    if (c) return c;
    c = SP.canvas(16, 16);
    const g = c.getContext('2d');
    Tiles.draw(g, ch, v, style || 'field', mask | 0, frame | 0);
    Tiles.cache.set(ck, c);
    return c;
  },
  draw(g, ch, v, style, mask, frame) {
    const P = (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    const rnd = U.rngFrom(v * 977 + ch.charCodeAt(0) * 31 + 5);
    const st = TILESTYLE[style] || TILESTYLE.field;
    const grass = (base = '#5aa83c') => {
      P(base, 0, 0, 16, 16);
      for (let i = 0; i < 7; i++) { const x = Math.floor(rnd() * 15), y = Math.floor(rnd() * 15); P('#4a9030', x, y + 1); P('#7cc858', x + 1, y); }
    };
    const floor = () => {
      P(st.floor[0], 0, 0, 16, 16);
      P(st.floor[1], 0, 7, 16, 1); P(st.floor[1], 0, 15, 16, 1);
      P(st.floor[1], (v % 2) ? 7 : 3, 0, 1, 7); P(st.floor[1], (v % 2) ? 11 : 12, 8, 1, 7);
      for (let i = 0; i < 4; i++) P(st.floor[2], Math.floor(rnd() * 16), Math.floor(rnd() * 16));
    };
    const water = (deep) => {
      P(deep ? '#2c5cc0' : '#3a78d8', 0, 0, 16, 16);
      const o = frame % 2 ? 2 : 0;
      for (let i = 0; i < 3; i++) { const yy = (i * 5 + v * 3 + 2) % 16; const xx = (i * 7 + v * 5 + o) % 12; P('#7ab4f4', xx, yy, 3, 1); P('#5a98e8', xx + 3, yy + 1, 2, 1); }
      // shore foam where neighbour is land: mask bits 1=up 2=right 4=down 8=left
      if (mask & 1) { P('#d8c890', 0, 0, 16, 2); P('#e8f4ff', 0, 2, 16, 1); }
      if (mask & 4) { P('#d8c890', 0, 14, 16, 2); P('#e8f4ff', 0, 13, 16, 1); }
      if (mask & 8) { P('#d8c890', 0, 0, 2, 16); P('#e8f4ff', 2, 0, 1, 16); }
      if (mask & 2) { P('#d8c890', 14, 0, 2, 16); P('#e8f4ff', 13, 0, 1, 16); }
    };
    const tree = (cx, cy, r) => {
      P('#6a4220', cx - 0, cy + r - 1, 2, 3);
      g.fillStyle = '#1e5a26'; g.beginPath(); g.arc(cx + 1, cy, r + 0.5, 0, 7); g.fill();
      g.fillStyle = '#2e7a34'; g.beginPath(); g.arc(cx + 0.5, cy - 0.5, r - 0.5, 0, 7); g.fill();
      P('#58a848', cx - 1, cy - 2, 2, 1); P('#58a848', cx - 2, cy - 1, 1, 1);
    };
    switch (ch) {
      case '.': grass(); break;
      case 'r': {
        grass();
        const m = mask || 10;
        const road = (x, y, w, h) => P('#c8a868', x, y, w, h);
        road(4, 4, 8, 8);
        if (m & 1) road(4, 0, 8, 4);
        if (m & 4) road(4, 12, 8, 4);
        if (m & 8) road(0, 4, 4, 8);
        if (m & 2) road(12, 4, 4, 8);
        for (let i = 0; i < 5; i++) { const x = 4 + Math.floor(rnd() * 8), y = 4 + Math.floor(rnd() * 8); P('#a88848', x, y); }
        P('#b89858', 4, 4, 1, 1); break;
      }
      case 'v': grass(); P('#e0d0a8', 2, 7, 12, 8); P('#5a6a80', 1, 3, 14, 5); P('#7a8aa0', 2, 3, 12, 3); P('#3a4a5a', 1, 7, 14, 1);
        P('#4a2a10', 6, 10, 4, 5); P('#8a6a3a', 7, 0, 1, 4); break;
      case 'T': grass('#4a9834'); tree(4, 6, 4); tree(11, 9, 4); if (v % 2) tree(6, 12, 3); break;
      case '^': grass('#6aa040');
        g.fillStyle = '#8a6a3a'; g.beginPath(); g.moveTo(1, 15); g.lineTo(8, 2); g.lineTo(15, 15); g.fill();
        g.fillStyle = '#b08a52'; g.beginPath(); g.moveTo(1, 15); g.lineTo(8, 2); g.lineTo(8, 15); g.fill();
        P('#5a4424', 8, 6, 1, 9); P('#d0b070', 6, 6, 1, 2); break;
      case 'M': P('#6a6a72', 0, 0, 16, 16);
        g.fillStyle = '#8a8a92'; g.beginPath(); g.moveTo(0, 16); g.lineTo(7, 1); g.lineTo(16, 16); g.fill();
        g.fillStyle = '#f0f0f8'; g.beginPath(); g.moveTo(5, 5); g.lineTo(7, 1); g.lineTo(10, 6); g.lineTo(8, 5); g.fill();
        P('#4a4a52', 9, 7, 1, 8); P('#4a4a52', 4, 10, 1, 5); break;
      case '~': water(false); break;
      case 'R': water(false); break;
      case '=': water(false); P('#a87038', 0, 2, 16, 12); for (let i = 0; i < 16; i += 3) P('#7a4e24', i, 2, 1, 12); P('#5a3818', 0, 2, 16, 1); P('#5a3818', 0, 13, 16, 1); break;
      case ',': P('#e2cf96', 0, 0, 16, 16); for (let i = 0; i < 8; i++) P(i % 2 ? '#cdb878' : '#f0e0b0', Math.floor(rnd() * 16), Math.floor(rnd() * 16)); break;
      case 'H': grass(); P('#c8b490', 2, 7, 12, 8); P('#8a3a2a', 1, 3, 14, 5); P('#b04a34', 2, 3, 12, 3); P('#5a2a1a', 1, 7, 14, 1);
        P('#5a3a1e', 7, 10, 3, 5); P('#88c8f0', 3, 9, 2, 2); P('#88c8f0', 11, 9, 2, 2); break;
      case 'V': grass(); P('#e0d0a8', 2, 7, 12, 8); P('#2a5aa0', 1, 3, 14, 5); P('#3a78c8', 2, 3, 12, 3); P('#1a3a6a', 1, 7, 14, 1);

      case 'F': grass(); P('#8a8a92', 1, 4, 14, 11); P('#a8a8b0', 1, 4, 14, 2);
        for (let i = 1; i < 15; i += 3) P('#8a8a92', i, 2, 2, 2);
        P('#3a2a20', 6, 9, 4, 6); P('#6a6a72', 1, 14, 14, 1); P('#6a6a72', 5, 8, 6, 1); break;
      case '#': P(st.wall[0], 0, 0, 16, 16);
        for (let r = 0; r < 4; r++) { P(st.wall[1], 0, r * 4 + 3, 16, 1); const o = r % 2 ? 4 : 0; for (let i = o; i < 16; i += 8) P(st.wall[1], i, r * 4, 1, 3); }
        P(st.wall[2], 0, 0, 16, 1); break;
      case '_': floor(); break;
      case 'I': floor(); P('#2a2a36', 4, 14, 9, 2); P(st.wall[2], 4, 2, 8, 13); P(st.wall[0], 9, 2, 3, 13); P(st.wall[1], 3, 1, 10, 2); P(st.wall[1], 3, 13, 10, 2); break;
      case 'S': floor(); P('#a01c2c', 3, 0, 10, 16); P('#c8303c', 4, 0, 8, 16);
        P('#d8a830', 4, 1, 8, 10); P('#a01c2c', 5, 2, 6, 6); P('#f8d860', 4, 1, 8, 1); P('#7a5a10', 5, 11, 1, 3); P('#7a5a10', 10, 11, 1, 3); break;
      case 'C': floor(); P('#2a1a10', 2, 7, 12, 8); P('#a86a28', 3, 8, 10, 6); P('#c8883a', 3, 8, 10, 2); P('#f8cc48', 3, 10, 10, 1); P('#f8cc48', 7, 10, 2, 3); P('#6a4218', 3, 13, 10, 1); break;

      case 'c': P('#7a5e44', 0, 0, 16, 16); for (let i = 0; i < 16; i += 3) P('#5a4430', i + (v % 2), 0, 1, 16); P('#9a7a5a', 0, 0, 16, 2); P('#4a3624', 0, 15, 16, 1); break;
      case 'h': grass('#5a9a40'); P('#8a8070', 1, 8, 5, 7); P('#8a8070', 10, 5, 5, 10); P('#a89a88', 10, 5, 5, 1); P('#6a6258', 2, 12, 12, 1); P('#a89a88', 6, 13, 3, 2); break;
      case 'A': floor(); P('#9a98a8', 3, 7, 10, 8); P('#c0bed0', 3, 7, 10, 2); P('#ffd84a', 7, 3, 2, 4); P('#fff8c0', 7, 2, 2, 2); P('#ffa830', 6, 5, 4, 1); break;
      case 'x': P('#2a2440', 0, 0, 16, 16); for (let i = 0; i < 6; i++) P(frame % 2 ? '#4a4070' : '#3a3460', (i * 5 + v * 3 + frame) % 16, (i * 7 + v) % 16, 4, 2); break;
      default: P('#000', 0, 0, 16, 16);
    }
  },
};

// ===================== procedural portraits (32x32) =====================
const SKINS = [['#f6c79c', '#d6996a'], ['#e0a878', '#b47448'], ['#c8b8e8', '#8a7ab0'], ['#ece4cc', '#a8a088']];
const Portrait = {
  cache: new Map(),
  get(p) {
    const ck = JSON.stringify(p);
    if (Portrait.cache.has(ck)) return Portrait.cache.get(ck);
    const N = 32;
    const g = [];
    for (let y = 0; y < N; y++) g.push(new Array(N).fill('.'));
    const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < N && y < N) g[y][x] = c; };
    const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, c); };
    const ell = (cx, cy, rx, ry, c, cond) => {
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const v = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
        if (v <= 1 && (!cond || cond(x, y))) set(x, y, c);
      }
    };
    const inFace = (x, y) => ((x - 16) / 7.2) ** 2 + ((y - 15) / 8) ** 2 <= 1;
    const hair = p.hair || 'short';
    const eye = p.eye || 'normal';
    // ---- back layer ----
    if (hair === 'long') { rect(7, 11, 18, 18, 'h'); rect(6, 15, 20, 10, 'h'); rect(7, 27, 4, 3, 'H'); rect(21, 27, 4, 3, 'H'); }
    if (hair === 'bob') { rect(7, 11, 18, 10, 'h'); }
    if (hair === 'braid') { rect(22, 14, 3, 14, 'h'); for (let y = 15; y < 28; y += 3) { set(22, y, 'H'); set(24, y + 1, 'H'); } rect(22, 27, 3, 2, 'r'); }
    if (hair === 'ponytail') { rect(23, 7, 4, 5, 'h'); rect(24, 11, 4, 13, 'h'); rect(25, 23, 3, 3, 'H'); set(24, 14, 'H'); set(25, 18, 'H'); }
    if (p.acc === 'veil' || hair === 'hood') { const uc = 'u'; rect(6, 10, 20, 20, uc); }
    // ---- shoulders ----
    ell(16, 33, 14.5, 8.5, 'c');
    rect(3, 28, 26, 4, 'c');
    rect(4, 30, 24, 2, 'C');
    for (let i = 0; i < 4; i++) { set(12 - i, 25 + i, 'C'); set(19 + i, 25 + i, 'C'); }
    // neck
    rect(13, 21, 6, 6, 'S'); rect(14, 21, 4, 5, 's');
    if (p.acc === 'scarf') { rect(10, 24, 12, 3, 'r'); rect(10, 27, 3, 4, 'r'); set(11, 27, 'R'); set(11, 29, 'R'); rect(10, 24, 12, 1, 'R'); }
    if (p.acc === 'armor') { rect(4, 27, 24, 5, 'm'); rect(4, 27, 24, 1, 'w'); rect(14, 27, 4, 5, 'M'); rect(4, 30, 24, 1, 'M'); }
    if (p.acc === 'robe') { rect(13, 26, 6, 6, 'y'); rect(14, 26, 4, 6, 'u'); }
    // ---- face ----
    ell(16, 15, 7.2, 8, 's');
    for (let y = 19; y <= 22; y++) { const inset = y - 18; for (let x = 9; x <= 23; x++) if (g[y][x] === 's' && (x < 9 + inset || x > 23 - inset)) g[y][x] = '.'; }
    set(9, 18, 'S'); set(23, 18, 'S'); set(10, 19, 'S'); set(22, 19, 'S'); set(11, 20, 'S'); set(21, 20, 'S'); set(12, 21, 'S'); set(20, 21, 'S');
    rect(13, 22, 7, 1, 's'); set(13, 22, 'S'); set(19, 22, 'S');
    rect(8, 14, 1, 4, 's'); rect(24, 14, 1, 4, 's'); set(8, 17, 'S'); set(24, 17, 'S');
    // ---- eyes ----
    const eyeAt = (x0, right) => {
      const X = i => right ? x0 + 2 - i : x0 + i; // x0 = left column of the 3-wide eye
      if (eye === 'big') {
        rect(x0 - (right ? 0 : 1), 13, 4, 1, 'e');
        rect(x0, 14, 3, 3, 'i'); rect(x0, 16, 3, 1, 'I');
        set(X(0), 14, 'w'); set(X(1), 15, 'e'); set(X(2), 15, 'e'); set(X(1), 14, 'e');
      } else if (eye === 'sharp') {
        rect(x0 - (right ? 0 : 1), 14, 4, 1, 'e'); rect(x0, 15, 3, 1, 'i'); set(X(1), 15, 'e'); set(X(2), 16, 'S');
      } else if (eye === 'old') {
        rect(x0, 15, 3, 1, 'e'); set(X(0), 14, 'S'); set(X(2), 14, 'S'); set(X(1), 17, 'S');
      } else { // normal / glasses
        rect(x0, 14, 3, 1, 'e'); rect(x0, 15, 3, 2, 'i'); set(X(1), 15, 'e'); set(X(1), 16, 'e'); set(X(0), 15, 'w');
      }
    };
    eyeAt(11, false); eyeAt(18, true);
    // brows
    if (eye === 'sharp') { set(10, 13, 'H'); set(11, 12, 'H'); set(12, 12, 'H'); set(13, 13, 'H'); set(18, 13, 'H'); set(19, 12, 'H'); set(20, 12, 'H'); set(21, 13, 'H'); }
    else if (eye === 'big') { rect(11, 11, 3, 1, 'H'); rect(18, 11, 3, 1, 'H'); }
    else if (eye === 'old') { rect(10, 13, 4, 1, 'H'); rect(18, 13, 4, 1, 'H'); }
    else { rect(11, 12, 3, 1, 'H'); rect(18, 12, 3, 1, 'H'); }
    // nose, mouth, blush
    set(16, 17, 'S'); set(16, 18, 'S'); set(15, 18, 's');
    rect(15, 20, 3, 1, 'd');
    if (eye === 'big') { rect(10, 18, 2, 1, 'b'); rect(20, 18, 2, 1, 'b'); }
    if (eye === 'glasses') {
      rect(10, 13, 5, 1, 'k'); rect(17, 13, 5, 1, 'k'); rect(10, 17, 5, 1, 'k'); rect(17, 17, 5, 1, 'k');
      rect(10, 13, 1, 5, 'k'); rect(14, 13, 1, 5, 'k'); rect(17, 13, 1, 5, 'k'); rect(21, 13, 1, 5, 'k'); rect(15, 14, 2, 1, 'k');
      rect(11, 14, 3, 3, 'l'); rect(18, 14, 3, 3, 'l'); set(12, 15, 'e'); set(19, 15, 'e'); set(11, 14, 'w'); set(18, 14, 'w');
    }
    // ---- front hair ----
    const top = (bottom) => ell(16, 10, 9.2, 6.5, 'h', (x, y) => y <= bottom);
    const sides = (len) => { rect(7, 10, 3, len, 'h'); rect(23, 10, 3, len, 'h'); };
    const shine = () => { set(11, 6, 'j'); set(12, 5, 'j'); set(13, 5, 'j'); set(12, 6, 'j'); set(19, 6, 'j'); };
    switch (hair) {
      case 'short': top(11); sides(5); for (const x of [10, 13, 14, 17, 20, 21]) set(x, 12, 'h'); set(14, 13, 'h'); shine(); break;
      case 'spiky': top(11); sides(6);
        for (let i = 0; i < 6; i++) { const x = 8 + i * 3; set(x + 1, 2, 'h'); set(x, 3, 'h'); set(x + 1, 3, 'h'); set(x + 2, 4, 'h'); }
        for (const x of [10, 12, 13, 16, 19, 21]) set(x, 12, 'h'); set(13, 13, 'h'); set(19, 13, 'h'); shine(); break;
      case 'long': top(11); sides(9); rect(10, 11, 12, 1, 'h'); for (const x of [10, 11, 14, 15, 18, 21]) set(x, 12, 'h'); shine(); break;
      case 'bob': top(11); sides(9); rect(10, 12, 2, 1, 'h'); rect(15, 12, 3, 1, 'h'); rect(20, 12, 2, 1, 'h'); shine(); break;
      case 'ponytail': top(11); sides(5); for (const x of [10, 11, 12, 15, 19]) set(x, 12, 'h'); rect(22, 6, 3, 2, 'r'); shine(); break;
      case 'messy': top(11); sides(6); set(6, 8, 'h'); set(26, 9, 'h'); set(10, 3, 'h'); set(16, 2, 'h'); set(22, 3, 'h'); set(18, 3, 'h');
        for (const x of [10, 12, 13, 17, 20]) set(x, 12, 'h'); set(12, 13, 'h'); set(20, 13, 'h'); shine(); break;
      case 'braid': top(11); sides(6); rect(10, 12, 3, 1, 'h'); rect(19, 12, 3, 1, 'h'); shine(); break;
      case 'bald': rect(7, 12, 2, 5, 'h'); rect(24, 12, 2, 5, 'h'); set(14, 8, 'S'); set(18, 9, 'S'); set(12, 10, 'S'); break;
      case 'hood': ell(16, 11, 10.5, 9.5, 'u', (x, y) => !inFace(x, y) || y < 10); rect(9, 10, 14, 1, 'U'); rect(6, 20, 20, 7, 'u'); ell(16, 15, 7.2, 8, 'U', (x, y) => !inFace(x, y) && y > 9 && y < 22); break;
      case 'helm': ell(16, 10, 9.6, 7, 'm', (x, y) => y <= 12); rect(7, 12, 3, 8, 'm'); rect(23, 12, 3, 8, 'm'); rect(8, 12, 16, 1, 'M'); rect(15, 3, 2, 10, 'M'); rect(15, 13, 2, 4, 'M'); set(11, 6, 'w'); set(12, 5, 'w'); break;
    }
    if (p.acc === 'veil') { ell(16, 9, 9.5, 5, 'u', (x, y) => y <= 11); rect(7, 10, 3, 14, 'u'); rect(23, 10, 3, 14, 'u'); rect(8, 11, 17, 1, 'U'); }
    if (p.acc === 'circlet') { rect(9, 10, 15, 1, 'y'); set(16, 9, 'y'); set(16, 10, 'l'); set(15, 10, 'x'); set(17, 10, 'x'); }
    if (p.acc === 'crown') { rect(9, 4, 15, 3, 'y'); for (let x = 9; x < 24; x += 3) set(x, 3, 'y'); set(16, 5, 'r'); rect(9, 6, 15, 1, 'Y'); }
    if (p.acc === 'beard') { for (let y = 18; y <= 25; y++) { const w = y < 22 ? 15 - (y - 18) : 11 - (y - 22) * 2; rect(16 - Math.floor(w / 2), y, w, 1, 'h'); } rect(14, 20, 4, 1, 'd'); set(15, 18, 'S'); set(17, 18, 'S'); }
    if (p.acc === 'mustache') { rect(13, 19, 7, 1, 'h'); set(12, 20, 'h'); set(20, 20, 'h'); }
    if (p.acc === 'scar') { set(19, 12, 'r'); set(20, 13, 'r'); set(20, 16, 'r'); set(21, 17, 'r'); }
    if (p.acc === 'patch') { rect(18, 14, 4, 3, 'k'); for (let x = 9; x < 24; x++) set(x, 13 - Math.round((x - 9) * 0.25), 'k'); }
    if (hair === 'skull') { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (g[y][x] === 's' || g[y][x] === 'S') g[y][x] = g[y][x] === 's' ? 'q' : 'Q'; }
    // ---- outline ----
    const out = g.map(r => r.slice());
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (g[y][x] !== '.') continue;
      const n = (yy, xx) => yy >= 0 && yy < N && xx >= 0 && xx < N && g[yy][xx] !== '.';
      if (n(y - 1, x) || n(y + 1, x) || n(y, x - 1) || n(y, x + 1)) out[y][x] = 'k';
    }
    const sk = SKINS[p.skin || 0];
    const hc = p.hc || '#5a3a2a';
    const cl = p.cloth || '#3a5aa0';
    const ec = p.ec || '#3a5a9a';
    const uc = p.uc || '#f0f0f8';
    const pal = Object.assign({}, PAL, {
      s: sk[0], S: sk[1], h: hc, H: SP.shade(hc, 0.62), j: SP.shade(hc, 1.35), c: cl, C: SP.shade(cl, 0.62),
      e: '#1a1424', i: ec, I: SP.shade(ec, 1.5), d: SP.shade(sk[1], 0.78), b: '#f2a2a0', u: uc, U: SP.shade(uc, 0.72), k: '#1a1222',
    });
    const c = SP.canvas(N, N), x = c.getContext('2d');
    const img = x.createImageData(N, N);
    for (let y = 0; y < N; y++) for (let xx = 0; xx < N; xx++) {
      const ch = out[y][xx];
      if (ch === '.') continue;
      const [r, gg, b] = SP.rgb(pal[ch] || '#ff00ff');
      const i = (y * N + xx) * 4;
      img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    Portrait.cache.set(ck, c);
    return c;
  },
};

    { w: 'tri', v: 0.15, n: 'a2:4 e3:4 a3:4 e3:4 | a2:4 e3:4 a3:4 e3:4 | f2:4 c3:4 f3:4 c3:4 | e2:4 b2:4 e3:4 b2:4 | a2:4 e3:4 a3:4 e3:4 | c3:4 g3:4 c4:4 g3:4 | d3:4 a3:4 e2:4 b2:4 | a2:4 e3:4 a2:8' },
  ] },
};

const Music = {
  timer: null, song: null, step: 0, nextT: 0, waves: {},
  n2f(n) {
    const m = /^([a-g])(#?)(-?\d)$/.exec(n);
    if (!m) return 0;
    const base = { c: -9, d: -7, e: -5, f: -4, g: -2, a: 0, b: 2 }[m[1]] + (m[2] ? 1 : 0);
    const semis = base + (parseInt(m[3], 10) - 4) * 12;
    return 440 * Math.pow(2, semis / 12);
  },
  parse(str) {
    const ev = [];
    let pos = 0;
    for (const tok of str.replace(/\|/g, ' ').split(/\s+/).filter(Boolean)) {
      const [n, l] = tok.split(':');
      const len = parseInt(l, 10) || 1;
      if (n !== 'r') ev.push({ at: pos, n, len });
      pos += len;
    }
    return { ev, total: pos };
  },
  wave(d) {
    if (Music.waves[d]) return Music.waves[d];
    const N = 48, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
    for (let i = 1; i <= N; i++) re[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * d);
    const w = Snd.ac.createPeriodicWave(re, im);
    Music.waves[d] = w;
    return w;
  },
  play(song) {
    Music.stop();
    if (!Snd.ac) return;
    const tracks = song.tracks.map(t => Object.assign({}, t, Music.parse(t.n)));
    const total = Math.max(...tracks.map(t => t.total));
    const map = tracks.map(t => { const m = new Map(); t.ev.forEach(e => { if (!m.has(e.at)) m.set(e.at, []); m.get(e.at).push(e); }); return m; });
    Music.song = { bpm: song.bpm, tracks, total, map };
    Music.step = 0;
    Music.nextT = Snd.ac.currentTime + 0.08;
    Music.bus = Snd.ac.createGain();
    Music.bus.gain.value = 1;
    Music.bus.connect(Snd.master);
    Music.timer = setInterval(Music.tick, 30);
    Music.tick();
  },
  stop() {
    if (Music.timer) clearInterval(Music.timer);
    Music.timer = null;
    if (Music.bus && Snd.ac) { try { Music.bus.gain.setTargetAtTime(0, Snd.ac.currentTime, 0.05); const b = Music.bus; setTimeout(() => b.disconnect(), 400); } catch (e) { /* */ } }
    Music.bus = null;
    Music.song = null;
  },
  tick() {
    const s = Music.song, ac = Snd.ac;
    if (!s || !ac) return;
    const spb = 60 / s.bpm / 4;
    while (Music.nextT < ac.currentTime + 0.25) {
      s.tracks.forEach((t, ti) => {
        const st = Music.step % t.total;
        const evs = s.map[ti].get(st);
        if (evs) for (const e of evs) Music.note(t, e, Music.nextT, e.len * spb);
      });
      Music.step = (Music.step + 1) % s.total;
      Music.nextT += spb;
    }
  },
  note(t, e, t0, dur) {
    const ac = Snd.ac, out = Music.bus;
    if (!out) return;
    if (t.w === 'drum') {
      if (e.n === 'k') { Snd.tone(130, t0, 0.13, 'sine', t.v * 2.2, -95, out); }
      else if (e.n === 's') { Snd.noise(t0, 0.11, t.v * 1.6, 1400, out); Snd.tone(190, t0, 0.06, 'triangle', t.v * 0.8, -40, out); }
      else if (e.n === 'h') { Snd.noise(t0, 0.03, t.v * 0.9, 7000, out); }
      return;
    }
    const f = Music.n2f(e.n);
    if (!f) return;
    const o = ac.createOscillator(), g = ac.createGain();
    if (t.w === 'tri') o.type = 'triangle';
    else o.setPeriodicWave(Music.wave(t.w === 'p12' ? 0.125 : t.w === 'p25' ? 0.25 : 0.5));
    o.frequency.setValueAtTime(f, t0);
    const end = t0 + Math.max(0.05, dur * 0.92);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(t.v, t0 + 0.006);
    g.gain.linearRampToValueAtTime(t.v * (t.w === 'tri' ? 0.9 : 0.6), t0 + Math.min(dur * 0.5, 0.25));
    g.gain.linearRampToValueAtTime(0.0001, end);
    o.connect(g); g.connect(out);
    o.start(t0); o.stop(end + 0.02);
  },
};

// ===================== battle rules (pure-ish) =====================
// Battle unit fields: id, rid (roster id or null), side 'P'|'E'|'N', name, cls, lv, exp,
//   hp, mhp, str, mag, skl, spd, lck, def, res, item, hair, x, y, acted, moved, boss, ai, lead, talk, g (growths)
const R = {
  C: u => CLS[u.cls],
  tier: u => (CLS[u.cls].tier || 1),
  bonus(u, k) {
    const it = u.item && ITEM[u.item];
    return it && it.bon && it.bon[k] ? it.bon[k] : 0;
  },
  st(u, k) { return (u[k] || 0) + R.bonus(u, k); },
  mov(u) { return CLS[u.cls].mov + R.bonus(u, 'mov'); },
  mt(u) { return CLS[u.cls].mt; },
  isFly: u => CLS[u.cls].mt === 'fly',
  tags(u) { const t = (CLS[u.cls].tags || []).slice(); if (R.isFly(u)) t.push('fly'); return t; },
  isMagic: u => CLS[u.cls].w === 'magic',
  isStaff: u => CLS[u.cls].w === 'staff',
  // physical weapon (class weapon possibly replaced by item of the same kind)
  weapon(u) {
    const c = CLS[u.cls];
    if (c.w === 'magic' || c.w === 'staff') return null;
    const base = WPN[c.w];
    const it = u.item && ITEM[u.item];
    if (it && it.t === 'wpn' && it.k === base.k) {
      const w = Object.assign({ rng: base.rng.slice(), eff: base.eff }, it);
      if (!it.rng) w.rng = base.rng.slice();
      if (it.rngPlus) w.rng = [w.rng[0], w.rng[1] + it.rngPlus];
      if (!it.eff && base.eff) w.eff = base.eff;
      return w;
    }
    return Object.assign({}, base, { rng: base.rng.slice() });
  },
  spells(u) {
    const list = CLS[u.cls].spells || [];
    return list.filter(([, lv]) => u.lv >= lv).map(([id]) => id);
  },
  atkSpells(u) { return R.spells(u).filter(id => SPELL[id].k !== 'heal'); },
  healSpells(u) { return R.spells(u).filter(id => SPELL[id].k === 'heal'); },
  canItemFit(u, itemId) {
    const it = ITEM[itemId];
    if (!it) return false;
    if (it.t === 'acc') return true;
    const c = CLS[u.cls];
    if (c.w === 'magic' || c.w === 'staff') return false;
    return WPN[c.w].k === it.k;
  },
  // attack "modes" a unit can initiate with. mode: {sp: spellId|null, w: weaponLike}
  modes(u, forCounter) {
    if (R.isMagic(u)) {
      const out = [];
      for (const id of R.atkSpells(u)) {
        const s = SPELL[id];
        if (!forCounter && u.hp <= s.cost) continue;
        out.push({ sp: id, w: s });
        if (forCounter) break; // counters use the first attack spell, free of HP cost
      }
      return out;
    }
    const w = R.weapon(u);
    return w ? [{ sp: null, w }] : [];
  },
  terr(B, x, y) { return TERR[B.grid[y][x]] || TERR['.']; },
  inRange(mode, d) { return d >= mode.w.rng[0] && d <= mode.w.rng[1]; },
  maxRange(u) { let m = 0; for (const md of R.modes(u, false)) m = Math.max(m, md.w.rng[1]); return m; },
  minRange(u) { let m = 9; for (const md of R.modes(u, false)) m = Math.min(m, md.w.rng[0]); return m === 9 ? 1 : m; },

  // single side numbers for attacker a hitting defender d with mode, d standing at (dx,dy)
  calc(B, a, d, mode, dx, dy) {
    const w = mode.w;
    const magic = !!mode.sp;
    const tr = R.terr(B, dx, dy);
    const fly = R.isFly(d);
    const tAvo = fly ? 0 : tr.avo, tDef = fly ? 0 : tr.def;
    let mt = w.mt;
    const eff = (w.eff || []).some(t => R.tags(d).includes(t));
    if (eff) mt *= 3;
    const atk = (magic ? R.st(a, 'mag') : R.st(a, 'str')) + mt;
    const df = magic ? R.st(d, 'res') : R.st(d, 'def') + tDef;
    const dmg = Math.max(0, atk - df);
    const hit = w.hit + R.st(a, 'skl') * 2 + Math.floor(R.st(a, 'lck') / 2);
    const avo = R.st(d, 'spd') * 2 + R.st(d, 'lck') + tAvo;
    const hitP = U.clamp(hit - avo, 0, 100);
    const crit = U.clamp((w.crit || 0) + (CLS[a.cls].crit || 0) + Math.floor(R.st(a, 'skl') / 2) - R.st(d, 'lck'), 0, 100);
    const dbl = R.st(a, 'spd') >= R.st(d, 'spd') + 4;
    const per = w.brave ? 2 : 1;
    return { dmg, hit: hitP, crit, n: (dbl ? 2 : 1) * per, eff, mode };
  },
  // forecast: attacker a from (ax,ay) attacks d at its position
  forecast(B, a, d, mode, ax, ay) {
    if (ax === undefined) { ax = a.x; ay = a.y; }
    const dist = Math.abs(ax - d.x) + Math.abs(ay - d.y);
    const A = R.calc(B, a, d, mode, d.x, d.y);
    let D = null;
    const cm = R.modes(d, true)[0];
    if (cm && R.inRange(cm, dist)) D = R.calc(B, d, a, cm, ax, ay);
    return { a: A, d: D, dist, cost: mode.sp ? SPELL[mode.sp].cost : 0 };
  },
  // resolve the fight. returns {log, cost}
  combat(B, a, d, mode, rng) {
    const fc = R.forecast(B, a, d, mode);
    const log = [];
    if (fc.cost) a.hp = Math.max(1, a.hp - fc.cost);
    const strike = (who, s) => {
      const atk = who === 'a' ? a : d, def = who === 'a' ? d : a;
      const hit = rng() * 100 < s.hit;
      let crit = false, dmg = 0;
      if (hit) { crit = rng() * 100 < s.crit; dmg = s.dmg * (crit ? 2 : 1); dmg = Math.min(dmg, def.hp); def.hp -= dmg; }
      log.push({ who, hit, crit, dmg, hpA: a.hp, hpD: d.hp });
      return def.hp <= 0;
    };
    const per = s => (s.mode.w.brave ? 2 : 1);
    const seq = [];
    // order: A(xper), D(xper), then follow-ups for whoever doubles
    for (let i = 0; i < per(fc.a); i++) seq.push('a');
    if (fc.d) for (let i = 0; i < per(fc.d); i++) seq.push('d');
    if (fc.a.n > per(fc.a)) for (let i = 0; i < per(fc.a); i++) seq.push('a');
    if (fc.d && fc.d.n > per(fc.d)) for (let i = 0; i < per(fc.d); i++) seq.push('d');
    for (const who of seq) {
      if (a.hp <= 0 || d.hp <= 0) break;
      if (strike(who, who === 'a' ? fc.a : fc.d)) break;
    }
    return { log, fc, cost: fc.cost };
  },
  // heal amount
  healAmt(u, spellId, t) {
    const s = SPELL[spellId];
    return Math.min(t.mhp - t.hp, s.heal + Math.floor(R.st(u, 'mag') / 2));
  },
  // --- experience ---
  effLv: u => u.lv + (R.tier(u) === 2 ? 10 : 0),
  expFor(u, t, hit, killed) {
    if (u.lv >= 20 && R.tier(u) === 2) return 0;
    if (u.lv >= 20 && !CLS[u.cls].promo) return 0;
    const diff = R.effLv(t) - R.effLv(u);
    if (!hit && !killed) return 1;
    let e = U.clamp(10 + diff * 2, 1, 30);
    if (killed) e += 20 + Math.max(0, diff * 3) + (t.boss ? 30 : 0);
    return U.clamp(Math.round(e), 1, 100);
  },
  healExp(u) { return (u.lv >= 20 && R.tier(u) === 2) ? 0 : 12; },
  cap(u, k) { const c = CAP[R.tier(u)]; return k === 'hp' ? c.hp : c.other; },
  // apply exp; returns array of level-up gain objects
  gainExp(u, amt, rng) {
    const ups = [];
    if (!amt) return ups;
    u.exp += amt;
    while (u.exp >= 100) {
      if (u.lv >= 20) { u.exp = 0; break; }
      u.exp -= 100;
      u.lv++;
      ups.push(R.levelUp(u, rng));
    }
    if (u.lv >= 20) u.exp = 0;
    return ups;
  },
  levelUp(u, rng) {
    const gains = {};
    let any = false;
    SK.forEach((k, i) => {
      let g = u.g ? u.g[i] : 0;
      let n = 0;
      while (g >= 100) { n++; g -= 100; }
      if (rng() * 100 < g) n++;
      const cur = k === 'hp' ? u.mhp : u[k];
      n = Math.min(n, R.cap(u, k) - cur);
      if (n > 0) { gains[k] = n; any = true; }
    });
    if (!any) { // never an empty level: bump the best-growth stat that is not capped
      const order = SK.map((k, i) => [k, u.g ? u.g[i] : 0]).sort((a, b) => b[1] - a[1]);
      for (const [k] of order) { const cur = k === 'hp' ? u.mhp : u[k]; if (cur < R.cap(u, k)) { gains[k] = 1; break; } }
    }
    for (const k in gains) { if (k === 'hp') { u.mhp += gains[k]; u.hp += gains[k]; } else u[k] += gains[k]; }
    gains.lv = u.lv;
    return gains;
  },
  promote(u, to) {
    const c = CLS[to];
    const b = c.bonus || {};
    const gains = {};
    const wasChange = CLS[u.cls].change;
    u.cls = to;
    // class bonuses never push a stat past the new class's cap
    for (const k of SK) {
      const cur = k === 'hp' ? u.mhp : u[k];
      const add = Math.max(0, Math.min(b[k] || 0, R.cap(u, k) - cur));
      if (!add) continue;
      if (k === 'hp') { u.mhp += add; u.hp += add; } else u[k] += add;
      gains[k] = add;
    }
    if (!wasChange) { u.lv = 1; }
    u.exp = 0;
    // drop item if it no longer fits
    return gains;
  },
  // --- movement ---
  costAt(B, u, x, y) {
    const t = R.terr(B, x, y);
    return COST[R.mt(u)][t.c] || 99;
  },
  unitAt(B, x, y) { return B.units.find(v => v.hp > 0 && v.x === x && v.y === y && !v.gone); },
  foe: (a, b) => (a.side === 'E') !== (b.side === 'E'),
  // Dijkstra: returns Map key -> {x,y,c,px,py}
  reach(B, u, movOverride) {
    const mv = movOverride !== undefined ? movOverride : R.mov(u);
    const res = new Map();
    const start = { x: u.x, y: u.y, c: 0, px: -1, py: -1 };
    res.set(U.key(u.x, u.y), start);
    const open = [start];
    while (open.length) {
      let bi = 0;
      for (let i = 1; i < open.length; i++) if (open[i].c < open[bi].c) bi = i;
      const cur = open.splice(bi, 1)[0];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (nx < 0 || ny < 0 || nx >= B.w || ny >= B.h) continue;
        const occ = R.unitAt(B, nx, ny);
        if (occ && R.foe(occ, u)) continue;
        const nc = cur.c + R.costAt(B, u, nx, ny);
        if (nc > mv) continue;
        const k = U.key(nx, ny);
        const old = res.get(k);
        if (old && old.c <= nc) continue;
        const node = { x: nx, y: ny, c: nc, px: cur.x, py: cur.y };
        res.set(k, node);
        open.push(node);
      }
    }
    // remove tiles occupied by others (can pass through allies, cannot stop)
    for (const [k, n] of res) {
      const occ = R.unitAt(B, n.x, n.y);
      if (occ && occ !== u) n.block = true;
    }
    return res;
  },
  path(reach, x, y) {
    const out = [];
    let n = reach.get(U.key(x, y));
    while (n) { out.unshift({ x: n.x, y: n.y }); n = n.px < 0 ? null : reach.get(U.key(n.px, n.py)); }
    return out;
  },
  // tiles hittable from a set of standing tiles, using [minR,maxR]
  hitTiles(B, stands, minR, maxR) {
    const out = new Set();
    for (const s of stands) {
      for (let dy = -maxR; dy <= maxR; dy++) for (let dx = -maxR; dx <= maxR; dx++) {
        const d = Math.abs(dx) + Math.abs(dy);
        if (d < minR || d > maxR) continue;
        const x = s.x + dx, y = s.y + dy;
        if (x < 0 || y < 0 || x >= B.w || y >= B.h) continue;
        out.add(U.key(x, y));
      }
    }
    return out;
  },
  WARP: 7, // how far a mist shaman can step through the fog
  // full threat area of a unit (move + attack; shamans also count the tiles they can warp to)
  threat(B, u) {
    const rc = R.reach(B, u);
    const stands = [...rc.values()].filter(n => !n.block);
    const maxR = R.maxRange(u), minR = R.minRange(u);
    if (!maxR) return new Set();
    const out = R.hitTiles(B, stands, minR, maxR);
    if (CLS[u.cls].special === 'warp' && !u.boss) {
      const lim = R.WARP + maxR;
      for (let y = 0; y < B.h; y++) for (let x = 0; x < B.w; x++) {
        if (Math.abs(x - u.x) + Math.abs(y - u.y) <= lim && TERR[B.grid[y][x]].c !== 'block') out.add(U.key(x, y));
      }
    }
    return out;
  },
};

// ---- unit factories ----
const Units = {
  seq: 1,
  // make a roster (persistent) unit from CHAR data
  fromChar(id) {
    const c = CHAR[id];
    const u = { id, n: c.n, cls: c.cls, lv: c.lv, exp: 0, item: c.item || null, hair: c.hair, g: c.g.slice(), lead: !!c.lead, army: c.army, alive: true };
    SK.forEach((k, i) => { u[k] = c.s[i]; });
    u.mhp = u.hp;
    return u;
  },
  // enemy from class template at level
  enemy(spec) {
    const c = CLS[spec.c];
    const lv = spec.lv || 1;
    const u = { id: 'e' + (Units.seq++), n: spec.n || c.n, cls: spec.c, lv, exp: 0, item: spec.item || null, side: spec.side || 'E',
      x: spec.x, y: spec.y, boss: !!spec.boss, ai: spec.ai || 'agg', hair: spec.hair || U.pick(['#3a2a1a', '#5a3a2a', '#2a2a2a', '#7a6a4a']),
      talk: spec.talk || null, recruit: spec.recruit || null, drop: spec.drop || null, tag: spec.tag || null, join: !!spec.join, g: null };
    const base = c.b || [18, 5, 0, 4, 4, 0, 4, 1], gr = c.g || [.8, .4, 0, .4, .4, .1, .3, .1];
    SK.forEach((k, i) => { u[k] = Math.floor(base[i] + gr[i] * (lv - 1) + (spec.bonus && spec.bonus[k] || 0)); });
    if (spec.boss) { u.hp += 4; u.def += 1; u.res += 1; u.lck += 2; }
    u.mhp = u.hp;
    if (spec.recruit && CHAR[spec.recruit]) { // recruitable units use their real stats
      const r = Units.fromChar(spec.recruit);
      Object.assign(u, { n: r.n, cls: r.cls, lv: r.lv, hair: r.hair, g: r.g, item: r.item });
      SK.forEach(k => { u[k] = r[k]; });
      u.mhp = r.mhp; u.hp = r.mhp;
    }
    return u;
  },
  // battle copy of a roster unit
  toBattle(r, x, y) {
    const u = U.clone(r);
    u.rid = r.id; u.side = 'P'; u.x = x; u.y = y; u.hp = r.mhp; u.acted = false; u.moved = false;
    return u;
  },
};

// ===================== enemy / NPC AI =====================
const AI = {
  // probability that at least k of n hits land, each with p
  atLeast(n, k, p) {
    if (k <= 0) return 1;
    if (k > n) return 0;
    let tot = 0;
    const C = (a, b) => { let r = 1; for (let i = 0; i < b; i++) r = r * (a - i) / (i + 1); return r; };
    for (let i = k; i <= n; i++) tot += C(n, i) * Math.pow(p, i) * Math.pow(1 - p, n - i);
    return tot;
  },
  foes(B, u) { return B.units.filter(v => v.hp > 0 && !v.gone && R.foe(v, u)); },
  friends(B, u) { return B.units.filter(v => v.hp > 0 && !v.gone && !R.foe(v, u) && v !== u); },
  // distance (move cost) from every tile to nearest foe for unit u's movement type
  distMap(B, u) {
    const INF = 1e9;
    const d = [];
    for (let y = 0; y < B.h; y++) d.push(new Array(B.w).fill(INF));
    const open = [];
    for (const f of AI.foes(B, u)) { d[f.y][f.x] = 0; open.push({ x: f.x, y: f.y, c: 0 }); }
    while (open.length) {
      let bi = 0;
      for (let i = 1; i < open.length; i++) if (open[i].c < open[bi].c) bi = i;
      const cur = open.splice(bi, 1)[0];
      if (cur.c > d[cur.y][cur.x]) continue;
      // walking from a neighbour n into cur costs cost(cur); the foe tile itself is never entered
      const step = cur.c === 0 ? 1 : R.costAt(B, u, cur.x, cur.y);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (nx < 0 || ny < 0 || nx >= B.w || ny >= B.h) continue;
        if (R.costAt(B, u, nx, ny) >= 99) continue;
        const nc = cur.c + step;
        if (nc < d[ny][nx]) { d[ny][nx] = nc; open.push({ x: nx, y: ny, c: nc }); }
      }
    }
    return d;
  },
  stands(B, u) {
    if (u.ai === 'guard' || R.mov(u) === 0) return [{ x: u.x, y: u.y, c: 0 }];
    const rc = R.reach(B, u);
    const out = [...rc.values()].filter(n => !n.block);
    if (CLS[u.cls].special === 'warp' && !u.boss) {
      // mist shamans can step through the fog: any free tile within 2 of a foe, within R.WARP of itself
      for (const f of AI.foes(B, u)) {
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const x = f.x + dx, y = f.y + dy;
          if (Math.abs(dx) + Math.abs(dy) !== 2) continue;
          if (x < 0 || y < 0 || x >= B.w || y >= B.h) continue;
          if (Math.abs(x - u.x) + Math.abs(y - u.y) > R.WARP) continue;
          if (R.costAt(B, u, x, y) >= 99 || R.unitAt(B, x, y)) continue;
          if (!out.some(s => s.x === x && s.y === y)) out.push({ x, y, c: 20, warp: true });
        }
      }
    }
    return out;
  },
  triggered(B, u) {
    if (u.ai !== 'hold' || u.trig) return true;
    // wakes up when any foe stands inside its threat area, or when it was attacked
    const th = R.threat(B, u);
    for (const f of AI.foes(B, u)) if (th.has(U.key(f.x, f.y))) { u.trig = true; return true; }
    return false;
  },
  plan(B, u) {
    if (u.ai === 'idle') return null;
    const awake = AI.triggered(B, u);
    // a waiting healer still heals hurt allies within reach
    if (!awake && !R.healSpells(u).length) return null;
    const stands = AI.stands(B, u);
    let best = null;
    const consider = (p) => { if (!best || p.score > best.score) best = p; };
    // healing
    const heals = R.healSpells(u).filter(id => u.hp > SPELL[id].cost);
    if (heals.length) {
      for (const s of stands) for (const f of AI.friends(B, u)) {
        const miss = f.mhp - f.hp;
        if (miss < 6) continue;
        for (const id of heals) {
          const d = Math.abs(s.x - f.x) + Math.abs(s.y - f.y);
          const sp = SPELL[id];
          if (d < sp.rng[0] || d > sp.rng[1]) continue;
          consider({ s, act: 'heal', t: f, sp: id, score: 30 + Math.min(miss, R.healAmt(u, id, f)) - s.c * 0.01 });
        }
      }
    }
    if (!awake) return best;
    // attacking
    for (const md of R.modes(u, false)) {
      for (const s of stands) for (const t of AI.foes(B, u)) {
        const d = Math.abs(s.x - t.x) + Math.abs(s.y - t.y);
        if (!R.inRange(md, d)) continue;
        const fc = R.forecast(B, u, t, md, s.x, s.y);
        const A = fc.a, D = fc.d;
        const dealt = Math.min(t.hp, A.dmg * A.n) * A.hit / 100;
        const need = A.dmg > 0 ? Math.ceil(t.hp / A.dmg) : 99;
        const killP = AI.atLeast(A.n, need, A.hit / 100);
        const ctr = D ? Math.min(u.hp - (fc.cost || 0), D.dmg * D.n) * D.hit / 100 : 0;
        const tr = R.terr(B, s.x, s.y);
        let score = dealt + killP * 40 + (t.lead ? 8 : 0) + (R.healSpells(t).length ? 4 : 0) - ctr * 0.4 + (R.isFly(u) ? 0 : tr.avo * 0.05) - s.c * 0.01;
        if (A.dmg === 0) score -= 15;
        if (fc.cost) score -= fc.cost * 0.6;
        if (s.warp) score -= 0.5;
        consider({ s, act: 'attack', t, md, score });
      }
    }
    if (best) return best;
    // approach the nearest foe
    if (u.ai === 'guard' || R.mov(u) === 0) return null;
    const dm = AI.distMap(B, u);
    let bs = null, bd = dm[u.y][u.x];
    for (const s of stands) {
      if (s.warp) continue;
      const dv = dm[s.y][s.x];
      if (dv < bd || (dv === bd && bs && s.c < bs.c)) { bd = dv; bs = s; }
    }
    if (!bs || (bs.x === u.x && bs.y === u.y)) return null;
    return { s: bs, act: 'move', score: 0 };
  },
  // ordering for a phase
  order(B, side) {
    const list = B.units.filter(v => v.hp > 0 && !v.gone && v.side === side);
    const dist = v => { let m = 99; for (const f of AI.foes(B, v)) m = Math.min(m, Math.abs(f.x - v.x) + Math.abs(f.y - v.y)); return m; };
    return list.sort((a, b) => (a.boss ? 1 : 0) - (b.boss ? 1 : 0) || dist(a) - dist(b));
  },
};

// ===================== view / input / DOM helpers =====================
let Scene = null;
const View = {
  cv: null, ctx: null, dpr: 1, W: 1, H: 1, t: 0,
  init() {
    View.cv = document.getElementById('cv');
    View.ctx = View.cv.getContext('2d');
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => View.resize()) : null;
    if (ro) ro.observe(document.getElementById('view'));
    window.addEventListener('resize', () => View.resize());
    View.resize();
  },
  resize() {
    const r = View.cv.getBoundingClientRect();
    View.dpr = Math.min(window.devicePixelRatio || 1, 3);
    const W = Math.max(1, Math.round(r.width * View.dpr)), H = Math.max(1, Math.round(r.height * View.dpr));
    if (View.cv.width !== W || View.cv.height !== H) { View.cv.width = W; View.cv.height = H; }
    View.W = W; View.H = H;
    View.ctx.imageSmoothingEnabled = false;
    if (Scene && Scene.resize) Scene.resize();
  },
};
function go(scene, ...args) {
  if (Scene && Scene.exit) Scene.exit();
  Scene = scene;
  UI.clearOv();
  if (scene.enter) scene.enter(...args);
  View.resize();
}
function loop(t) {
  View.t = t;
  try { if (Scene && Scene.draw) { View.ctx.imageSmoothingEnabled = false; Scene.draw(View.ctx, t); } } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
const Input = {
  st: null, lp: null,
  init() {
    const cv = View.cv;
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * View.dpr, y: (e.clientY - r.top) * View.dpr }; };
    cv.addEventListener('pointerdown', e => {
      Snd.unlock();
      const p = pos(e);
      Input.st = { x: p.x, y: p.y, t: Date.now(), used: false };
      clearTimeout(Input.lp);
      Input.lp = setTimeout(() => {
        if (Input.st && !Input.st.used && Scene && Scene.onLong) { Input.st.used = true; Scene.onLong(Input.st.x, Input.st.y); }
      }, 480);
    });
    cv.addEventListener('pointermove', e => {
      if (!Input.st) return;
      const p = pos(e);
      if (!Input.st.drag && Math.abs(p.x - Input.st.x) + Math.abs(p.y - Input.st.y) > 12 * View.dpr) { clearTimeout(Input.lp); Input.st.used = true; Input.st.drag = true; Input.st.lx = p.x; Input.st.ly = p.y; }
      if (Input.st.drag) { if (Scene && Scene.onDrag) Scene.onDrag(p.x - Input.st.lx, p.y - Input.st.ly); Input.st.lx = p.x; Input.st.ly = p.y; }
    });
    const up = e => {
      clearTimeout(Input.lp);
      if (!Input.st) return;
      const st = Input.st; Input.st = null;
      if (st.used || e.type === 'pointercancel') return;
      if (Scene && Scene.onTap) Scene.onTap(st.x, st.y);
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('contextmenu', e => e.preventDefault());
  },
};

const UI = {
  log: [],
  topEl: null, panelEl: null, ovEl: null, handlers: {},
  init() {
    UI.topEl = document.getElementById('top');
    UI.panelEl = document.getElementById('panel');
    UI.ovEl = document.getElementById('ov');
    UI.delegate(UI.topEl, () => UI.handlers.top);
    UI.delegate(UI.panelEl, () => UI.handlers.panel);
  },
  delegate(root, getH) {
    root.addEventListener('click', e => {
      const el = e.target.closest('[data-a]');
      if (!el || !root.contains(el) || el.disabled) return;
      // the bar and the panel are frozen while a dialogue or a window is open
      if (Dialog.active || UI.ovEl.querySelector('.modal')) return;
      const h = getH();
      Snd.unlock();
      if (h && h[el.dataset.a]) { Snd.sfx('tick'); h[el.dataset.a](el.dataset, el); }
    });
  },
  setTop(html, h) { UI.topEl.innerHTML = html; UI.handlers.top = h || {}; UI.paint(UI.topEl); },
  setPanel(html, h) { UI.panelEl.innerHTML = html || ''; UI.handlers.panel = h || {}; UI.paint(UI.panelEl); },
  clearOv() { UI.ovEl.innerHTML = ''; if (typeof Dialog !== 'undefined') Dialog.active = false; },
  // canvases with data-spr / data-por are painted after insertion
  paint(root) {
    root.querySelectorAll('canvas[data-spr]').forEach(c => {
      const [key, team, hair, gray] = c.dataset.spr.split('|');
      c.width = 16; c.height = 16;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      x.drawImage(SP.get(key, team || 'P', hair || null, { gray: gray === '1', flip: team === 'E' }), 0, 0);
    });
    root.querySelectorAll('canvas[data-por]').forEach(c => {
      const p = Speakers.por(c.dataset.por);
      c.width = 32; c.height = 32;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      if (p) x.drawImage(Portrait.get(p), 0, 0);
    });
  },
  modal(html, h, opt = {}) {
    const el = document.createElement('div');
    el.className = 'modal' + (opt.cls ? ' ' + opt.cls : '');
    el.innerHTML = '<div class="win">' + html + '</div>';
    UI.ovEl.appendChild(el);
    UI.paint(el);
    const m = {
      el,
      close() { if (el.parentNode) el.parentNode.removeChild(el); if (opt.onClose) opt.onClose(); },
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (b && el.contains(b) && !b.disabled) { Snd.sfx('tick'); if (h && h[b.dataset.a]) h[b.dataset.a](b.dataset, b, m); return; }
      if (e.target === el && opt.dismiss !== false) m.close();
    });
    return m;
  },
  confirm(msg, yes = 'はい', no = 'いいえ') {
    return new Promise(res => {
      UI.modal(`<p>${msg}</p><div class="row end"><button class="btn" data-a="no">${no}</button><button class="btn y" data-a="yes">${yes}</button></div>`,
        { yes: (d, b, m) => { res(true); m.close(); }, no: (d, b, m) => { res(false); m.close(); } }, { onClose: () => res(false) });
    });
  },
  alert(msg, ok = 'OK') {
    if (Time.speed === 0) { UI.log.push(msg); return Promise.resolve(true); }
    return new Promise(res => {
      UI.modal(`<p>${msg}</p><div class="row end"><button class="btn y" data-a="ok">${ok}</button></div>`,
        { ok: (d, b, m) => { m.close(); } }, { onClose: () => res(true) });
    });
  },
  choose(title, items, opt = {}) {
    return new Promise(res => {
      let done = false;
      const fin = v => { if (!done) { done = true; res(v); } };
      const html = `<h3>${title}</h3>${opt.text ? '<p>' + opt.text + '</p>' : ''}<div class="list">` +
        items.map((it, i) => `<button class="btn${it.cls ? ' ' + it.cls : ''}" data-a="pick" data-i="${i}" ${it.dis ? 'disabled' : ''}>${it.t}${it.d ? '<br><span class="small dim">' + it.d + '</span>' : ''}</button>`).join('') +
        `</div>${opt.noCancel ? '' : '<div class="row end" style="margin-top:8px"><button class="btn" data-a="cancel">もどる</button></div>'}`;
      UI.modal(html, {
        pick: (d, b, m) => { const v = items[+d.i].v; fin(v); m.close(); },
        cancel: (d, b, m) => { fin(null); m.close(); },
      }, { onClose: () => fin(null), dismiss: !opt.noCancel });
    });
  },
  toast(msg, cls = '') {
    const el = document.createElement('div');
    el.className = 'toast win ' + cls;
    el.innerHTML = msg;
    UI.ovEl.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  },
  banner(text, cls) {
    const el = document.createElement('div');
    el.className = 'banner ' + (cls || 'p');
    el.textContent = text;
    UI.ovEl.appendChild(el);
    return Time.wait(1050).then(() => el.remove());
  },
  hpBar(hp, mhp) {
    const r = mhp ? hp / mhp : 0;
    return `<div class="hpbar ${r <= .25 ? 'crit' : r <= .5 ? 'low' : ''}"><i style="width:${Math.round(r * 100)}%"></i></div>`;
  },
};

// ===================== sound (WebAudio synth, original jingles) =====================
const Snd = {
  ac: null, master: null, sfxOn: true, bgmOn: true, cur: null, timer: null, unlocked: false,
  unlock() {
    if (Snd.unlocked) { if (Snd.ac && Snd.ac.state === 'suspended') Snd.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      Snd.ac = new AC();
      Snd.master = Snd.ac.createGain();
      Snd.master.gain.value = 0.32;
      Snd.master.connect(Snd.ac.destination);
      Snd.unlocked = true;
      if (Snd.want) { const w = Snd.want; Snd.want = null; Snd.bgm(w); }
    } catch (e) { /* no audio */ }
  },
  tone(f, t0, dur, type = 'square', vol = 0.18, slide = 0, dest) {
    const ac = Snd.ac; if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(dest || Snd.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(t0, dur, vol = 0.2, hp = 800, dest) {
    const ac = Snd.ac; if (!ac) return;
    if (!Snd.nbuf) { const n = ac.sampleRate * 0.5; Snd.nbuf = ac.createBuffer(1, n, ac.sampleRate); const d = Snd.nbuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(); s.buffer = Snd.nbuf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    s.connect(f); f.connect(g); g.connect(dest || Snd.master); s.start(t0); s.stop(t0 + dur + 0.02);
  },
  sfx(name) {
    if (!Snd.sfxOn || !Snd.ac || Time.speed === 0) return;
    const t = Snd.ac.currentTime + 0.01, T = Snd.tone, N = Snd.noise;
    switch (name) {
      case 'tick': T(880, t, 0.04, 'square', 0.06); break;
      case 'sel': T(660, t, 0.05, 'square', 0.1); T(990, t + 0.05, 0.06, 'square', 0.1); break;
      case 'step': T(220, t, 0.03, 'triangle', 0.12); break;
      case 'hit': N(t, 0.12, 0.35, 600); T(160, t, 0.12, 'square', 0.18, -80); break;
      case 'crit': N(t, 0.25, 0.45, 300); T(90, t, 0.3, 'sawtooth', 0.2, -50); T(1200, t, 0.08, 'square', 0.12); break;
      case 'miss': N(t, 0.15, 0.1, 3000); T(700, t, 0.12, 'triangle', 0.08, 500); break;
      case 'nodmg': T(1500, t, 0.05, 'square', 0.08); T(1100, t + 0.05, 0.08, 'square', 0.06); break;
      case 'swing': N(t, 0.08, 0.12, 2500); break;
      case 'arrow': N(t, 0.12, 0.1, 4000); T(1800, t, 0.1, 'triangle', 0.05, -900); break;
      case 'magic': T(500, t, 0.25, 'triangle', 0.12, 700); T(750, t + 0.05, 0.2, 'square', 0.05, 900); break;
      case 'heal': [523, 659, 784, 1047].forEach((f, i) => T(f, t + i * 0.07, 0.18, 'triangle', 0.12)); break;
      case 'die': T(400, t, 0.5, 'square', 0.12, -330); N(t, 0.4, 0.1, 400); break;
      case 'lvup': [523, 659, 784, 659, 784, 1047].forEach((f, i) => T(f, t + i * 0.08, 0.14, 'square', 0.1)); break;
      case 'get': [784, 988, 1175, 1568].forEach((f, i) => T(f, t + i * 0.06, 0.16, 'square', 0.09)); break;
      case 'win': [523, 523, 523, 659, 784, 698, 880, 1047].forEach((f, i) => T(f, t + [0, .12, .24, .36, .6, .84, .96, 1.08][i], 0.2, 'square', 0.11)); break;
      case 'lose': [392, 370, 349, 330].forEach((f, i) => T(f, t + i * 0.3, 0.35, 'triangle', 0.15)); break;
      case 'warp': T(300, t, 0.35, 'sine', 0.15, 900); T(900, t + 0.1, 0.25, 'sine', 0.1, -600); break;
      case 'door': N(t, 0.2, 0.2, 200); T(110, t, 0.2, 'square', 0.1); break;
    }
  },
  bgm(name) {
    if (!Snd.unlocked) { Snd.want = name; return; }
    if (Snd.cur === name) return;
    Snd.stopBgm();
    Snd.cur = name;
    if (!Snd.bgmOn || !name || !SONGS[name]) return;
    Music.play(SONGS[name]);
  },
  stopBgm() { Music.stop(); Snd.cur = null; },
};
