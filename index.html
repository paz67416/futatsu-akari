const Speakers = {
  get(id) { return CHAR[id] ? { n: CHAR[id].n, p: CHAR[id].p } : NPC[id] || null; },
  // is this playable character really around? (recruits that never joined or died do not speak)
  present(id, opt = {}) {
    if (!CHAR[id]) return true;
    if (opt.also && opt.also.includes(id)) return true; // joining in this very scene
    const G = typeof Game !== 'undefined' ? Game.G : null;
    if (!G) return true;
    const B = (typeof Battle !== 'undefined' && Scene === Battle) ? Battle.B : null;
    if (B) {
      const u = B.units.find(v => v.rid === id || (v.recruit === id && v.side !== 'P'));
      if (u) {
        if (u.side === 'P') return !B.dead.includes(id);
        if (opt.ally) return u.side === 'N' && u.join && u.hp > 0 && !u.gone;
        return u.hp > 0 && !u.gone;
      }
    }
    const r = G.units[id];
    return !!(r && r.alive);
  },
  name(id) { const s = Speakers.get(id); return s ? s.n : ''; },
  por(id) { const s = Speakers.get(id); return s ? s.p : null; },
};

const Dialog = {
  active: false,
  // lines: [[who, text], ...] who: speaker id or null for narration
  play(lines, opt = {}) {
    // drop lines of characters who are not here; a 3rd element lists characters a narration line needs
    lines = (lines || []).filter(l => (!l[0] || Speakers.present(l[0], opt)) && (!l[2] || l[2].every(id => Speakers.present(id, opt))));
    if (!lines.length) return Promise.resolve();
    return new Promise(res => {
      Dialog.active = true;
      let i = 0, typing = null, full = '', shown = 0, done = false;
      const box = document.createElement('div');
      box.className = 'dlg-wrap';
      box.style.cssText = 'position:absolute;inset:0;';
      box.innerHTML = `<button class="btn sm skip" data-k="skip">スキップ</button><div class="dlg"><canvas width="32" height="32"></canvas><div class="win tx"><div class="who"></div><div class="body" style="white-space:pre-line"></div><div class="nx">▼</div></div></div>`;
      UI.ovEl.appendChild(box);
      const cv = box.querySelector('canvas'), who = box.querySelector('.who'), body = box.querySelector('.body'), nx = box.querySelector('.nx');
      const finish = () => {
        if (done) return; done = true;
        clearInterval(typing); box.remove(); Dialog.active = false; res();
      };
      const show = () => {
        if (i >= lines.length) { finish(); return; }
        const [w, t] = lines[i];
        const sp = w ? Speakers.get(w) : null;
        if (sp) {
          cv.style.display = '';
          const x = cv.getContext('2d'); x.clearRect(0, 0, 32, 32); x.imageSmoothingEnabled = false; x.drawImage(Portrait.get(sp.p), 0, 0);
          who.textContent = sp.n; who.style.display = '';
        } else { cv.style.display = 'none'; who.style.display = 'none'; }
        body.style.textAlign = sp ? 'left' : 'center';
        full = t; shown = 0; body.textContent = ''; nx.style.display = 'none';
        clearInterval(typing);
        if (Time.speed === 0) { body.textContent = full; nx.style.display = ''; return; }
        typing = setInterval(() => {
          shown += 2;
          body.textContent = full.slice(0, shown);
          if (shown >= full.length) { clearInterval(typing); typing = null; nx.style.display = ''; }
        }, 28);
      };
      box.addEventListener('click', e => {
        Snd.unlock();
        if (e.target.closest('[data-k=skip]')) { finish(); return; }
        if (typing) { clearInterval(typing); typing = null; body.textContent = full; nx.style.display = ''; return; }
        Snd.sfx('tick');
        i++; show();
      });
      show();
      if (Time.speed === 0 && opt.auto !== false) { finish(); }
    });
  },
  card(title, sub) {
    return new Promise(res => {
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;opacity:0;transition:opacity .5s;text-align:center;padding:20px';
      el.innerHTML = `<div style="color:var(--yel);font-size:16px;letter-spacing:.3em;margin-bottom:10px">${U.esc(sub || '')}</div><div style="font-size:26px;letter-spacing:.12em">${U.esc(title)}</div><div class="dim small" style="margin-top:24px">タップで進む</div>`;
      UI.ovEl.appendChild(el);
      requestAnimationFrame(() => { el.style.opacity = '1'; });
      let closed = false;
      const close = () => { if (closed) return; closed = true; el.style.opacity = '0'; setTimeout(() => { el.remove(); res(); }, Time.speed === 0 ? 0 : 450); };
      el.addEventListener('click', () => { Snd.unlock(); close(); });
      setTimeout(close, Time.speed === 0 ? 0 : 2600);
    });
  },
};

// ===================== battle scene =====================
const Battle = {
  B: null, stage: 'none', sel: null, rc: null, origin: null, moveSet: null, atkSet: null,
  tgt: null, mode: null, modeList: null, hsp: null, shown: new Set(), danger: false, dangerSet: null,
  fx: [], fight: null, busy: false, ended: false, anim: {}, maps: [null, null], T: 16, ox: 0, oy: 0, swapSel: null, info: null,

  enter(B) {
    this.B = B;
    Object.assign(this, { stage: 'none', sel: null, rc: null, tgt: null, mode: null, fx: [], fight: null, busy: false, ended: false, anim: {}, swapSel: null, info: null, danger: false, dangerSet: null });
    this.shown = new Set();
    this.rng = U.rngFrom(B.rs);
    for (const u of B.units) { const n = parseInt(String(u.id).replace(/\D/g, ''), 10); if (n >= Units.seq) Units.seq = n + 1; }
    const pn = document.getElementById('panel');
    pn.style.height = ''; pn.style.minHeight = 'calc(170px + env(safe-area-inset-bottom, 0px))';
    this.safe = B.started ? JSON.stringify(B) : null;
    this.buildMap();
    this.layout();
    this.top();
    Snd.bgm(B.phase === 'E' ? 'enemy' : (B.bgm || 'battle'));
    if (!B.started) this.intro(); else this.resume();
  },
  exit() { const pn = document.getElementById('panel'); pn.style.height = ''; pn.style.minHeight = ''; this.B = null; this.safe = null; },
  // consistent snapshot used by every save while this battle is open
  snap() { if (this.B && !this.ended) this.safe = JSON.stringify(this.B); },
  resize() { if (this.B) this.layout(); },
  layout() {
    const B = this.B;
    let T = Math.floor(Math.min(View.W / B.w, View.H / B.h));
    const k = Math.floor(T / 16);
    if (k >= 2 && k * 16 >= T * 0.86) T = k * 16;
    this.T = Math.max(8, T);
    this.ox = Math.floor((View.W - this.T * B.w) / 2);
    this.oy = Math.floor((View.H - this.T * B.h) / 2);
  },
  buildMap() {
    const B = this.B;
    for (let f = 0; f < 2; f++) {
      const c = SP.canvas(B.w * 16, B.h * 16), g = c.getContext('2d');
      for (let y = 0; y < B.h; y++) for (let x = 0; x < B.w; x++) {
        g.drawImage(Tiles.get(B.grid[y][x], x, y, B.style, Tiles.mask(B.grid, x, y), f), x * 16, y * 16);
      }
      this.maps[f] = c;
    }
  },
  top() {
    const B = this.B;
    UI.setTop(`<div class="tl">${U.esc(B.name)}<small>${U.esc(B.obj.text)}</small></div><div class="tm">${B.phase === 'E' ? '敵の番' : '味方の番'}<br>ターン${B.turn}${B.obj.type === 'survive' ? '/' + B.obj.turns : ''}</div><button class="btn sm" data-a="menu">≡</button>`,
      { menu: () => this.menu() });
  },
  save() { Game.saveBattle(this.B); },
  tween(ms, fn) {
    if (Time.speed === 0) { fn(1); return Promise.resolve(); }
    const dur = ms / Time.speed;
    return new Promise(res => {
      const t0 = performance.now();
      const step = now => { const p = Math.min(1, (now - t0) / dur); fn(p); if (p < 1) requestAnimationFrame(step); else res(); };
      requestAnimationFrame(step);
    });
  },
  fxText(x, y, text, color = '#fff', big = false) { this.fx.push({ x, y, text, color, big, t0: performance.now() }); },
  alive(side) { return this.B.units.filter(u => u.hp > 0 && !u.gone && (!side || u.side === side)); },
  at(x, y) { return R.unitAt(this.B, x, y); },
  tileOf(px, py) { return { x: Math.floor((px - this.ox) / this.T), y: Math.floor((py - this.oy) / this.T) }; },

  // ---------------- flow ----------------
  async intro() {
    const B = this.B;
    this.busy = true;
    UI.setPanel('');
    if (B.card) await Dialog.card(B.name, B.card);
    await Dialog.play(B.ev.start);
    B.started = true;
    this.busy = false;
    if (this.alive('P').length > 1 && !B.noDeploy) this.deployStage();
    else this.playerPhase();
  },
  resume() {
    const B = this.B;
    if (B.phase === 'E') { B.phase = 'P'; } // saves are only made in player phase
    this.top();
    this.toIdle();
    UI.toast('中断したところから再開しました');
  },
  deployStage() {
    this.stage = 'deploy';
    this.swapSel = null;
    this.snap(); Game.save();
    UI.setPanel(`<div class="small">出撃準備：入れ替えたい仲間を<span class="yel">2人続けてタップ</span>すると位置が入れ替わります。</div>
      <div class="row end" style="margin-top:8px"><button class="btn" data-a="list">部隊を見る</button><button class="btn y" data-a="go">戦闘開始</button></div>`,
      { go: () => { this.stage = 'none'; this.playerPhase(); }, list: () => this.unitList() });
  },
  async playerPhase() {
    const B = this.B;
    B.phase = 'P';
    this.busy = true;
    this.stage = 'none';
    UI.setPanel('');
    this.top();
    if (B.obj.type === 'survive' && B.turn > B.obj.turns) { this.ended = true; return this.victory(); }
    await this.turnEvents('P');
    if (this.ended) return;
    Snd.bgm(B.bgm || 'battle');
    await UI.banner('味方の番', 'p');
    await this.phaseHeal('P');
    B.units.forEach(u => { if (u.side === 'P') { u.acted = false; u.moved = false; } });
    this.snap();
    this.save();
    this.busy = false;
    this.toIdle();
  },
  async endTurn() {
    if (this.busy || this.ended) return;
    const B = this.B;
    this.busy = true;
    this.toNone();
    B.phase = 'E';
    this.top();
    UI.setPanel('<div class="dim" style="padding:8px 2px">敵が行動しています……</div>');
    Snd.bgm('enemy');
    await UI.banner('敵の番', 'e');
    await this.phaseHeal('E');
    await this.turnEvents('E');
    if (this.ended) return;
    for (const u of AI.order(B, 'E')) {
      if (u.hp <= 0 || u.gone) continue;
      await this.aiAct(u);
      if (this.ended) return;
    }
    const npcs = this.alive('N');
    if (npcs.length) {
      await UI.banner('友軍の番', 'g');
      await this.phaseHeal('N');
      for (const u of AI.order(B, 'N')) {
        if (u.hp <= 0 || u.gone) continue;
        await this.aiAct(u);
        if (this.ended) return;
      }
    }
    B.turn++;
    this.playerPhase();
  },
  async aiAct(u) {
    const plan = AI.plan(this.B, u);
    if (!plan) return;
    if (plan.s.x !== u.x || plan.s.y !== u.y) await this.moveUnit(u, plan.s.x, plan.s.y, plan.s.warp);
    if (plan.act === 'attack') await this.attack(u, plan.t, plan.md);
    else if (plan.act === 'heal') await this.heal(u, plan.t, plan.sp);
    await Time.wait(90);
  },
  async phaseHeal(side) {
    const B = this.B;
    let any = false;
    for (const u of this.alive(side)) {
      const t = R.terr(B, u.x, u.y);
      let amt = 0;
      if (t.heal) amt += Math.ceil(u.mhp * t.heal / 100);
      if (u.item && ITEM[u.item] && ITEM[u.item].regen) amt += ITEM[u.item].regen;
      amt = Math.min(amt, u.mhp - u.hp);
      if (amt > 0) { u.hp += amt; this.fxText(u.x, u.y, '+' + amt, '#7dff9a'); any = true; }
    }
    if (any) { Snd.sfx('heal'); await Time.wait(500); }
  },
  async turnEvents(side) {
    const B = this.B;
    const ev = B.ev.turn && B.ev.turn[B.turn + side];
    const key = 'turn' + B.turn + side;
    if (!ev || B.fired[key]) return;
    B.fired[key] = true;
    if (ev.lines) await Dialog.play(ev.lines);
    if (ev.spawn) {
      for (const s of ev.spawn) {
        let { x, y } = s;
        if (this.at(x, y)) { // nudge to the nearest free tile (up to 3 steps away)
          const mt = CLS[s.c].mt;
          let alt = null;
          for (let r = 1; r <= 3 && !alt; r++) for (let dy = -r; dy <= r && !alt; dy++) for (let dx = -r; dx <= r && !alt; dx++) {
            if (Math.abs(dx) + Math.abs(dy) !== r) continue;
            const p = { x: x + dx, y: y + dy };
            if (p.x < 0 || p.y < 0 || p.x >= B.w || p.y >= B.h || this.at(p.x, p.y)) continue;
            if ((COST[mt][TERR[B.grid[p.y][p.x]].c] || 99) >= 99) continue;
            alt = p;
          }
          if (!alt) continue;
          x = alt.x; y = alt.y;
        }
        const u = Units.enemy(Object.assign({}, s, { x, y }));
        B.units.push(u);
        this.fxText(x, y, '増援', '#ff8a8a');
      }
      Snd.sfx('door');
      await Time.wait(600);
    }
  },
  checkEnd() {
    if (this.ended) return true;
    const B = this.B;
    if (B.units.some(u => u.side === 'P' && u.lead && u.hp <= 0) || !this.alive('P').length) { this.ended = true; this.defeat(); return true; }
    let won = false;
    if (B.obj.type === 'rout') won = !this.alive('E').length;
    else if (B.obj.type === 'boss') won = B.units.some(u => u.boss && u.hp <= 0) || !this.alive('E').length;
    if (won) { this.ended = true; this.victory(); return true; }
    return false;
  },
  async victory() {
    const B = this.B;
    this.busy = true;
    this.toNone();
    UI.setPanel('');
    Snd.stopBgm();
    Snd.sfx('win');
    await UI.banner('勝利！', 'p');
    await Time.wait(400);
    const npcOk = B.units.some(u => u.side === 'N' && u.join && u.hp > 0 && !u.gone);
    const lines = (!npcOk && B.ev.winNoNpc) ? B.ev.winNoNpc : B.ev.win;
    if (lines) await Dialog.play(lines, { ally: true });
    Game.finishBattle(B);
  },
  async defeat() {
    const B = this.B;
    this.busy = true;
    this.toNone();
    UI.setPanel('');
    Snd.stopBgm();
    Snd.sfx('lose');
    const lead = B.units.find(u => u.side === 'P' && u.lead && u.hp <= 0);
    if (Game.G.battleStart) { Game.G.battle = U.clone(Game.G.battleStart); this.safe = JSON.stringify(Game.G.battle); Game.save(); }
    await UI.banner('敗北…', 'e');
    UI.modal(`<h3>敗北</h3><p>${lead ? U.esc(lead.n) + 'が倒れてしまった…' : '部隊が全滅してしまった…'}</p>
      <div class="list"><button class="btn y" data-a="retry">この戦闘をはじめからやり直す</button><button class="btn" data-a="title">タイトルへ戻る</button></div>`,
      { retry: (d, b, m) => { m.close(); Game.retryBattle(); }, title: (d, b, m) => { m.close(); Game.toTitle(); } }, { dismiss: false });
  },

  // ---------------- stages / panel ----------------
  toNone() { this.stage = 'none'; this.sel = null; this.rc = null; this.tgt = null; this.moveSet = null; this.atkSet = null; },
  toIdle() {
    this.toNone();
    this.stage = 'idle';
    if (this.danger) this.calcDanger();
    for (const id of [...this.shown]) { const u = this.B.units.find(v => v.id === id); if (!u || u.hp <= 0 || u.gone) this.shown.delete(id); }
    this.panelIdle();
  },
  panelIdle(msg) {
    const B = this.B;
    const left = this.alive('P').filter(u => !u.acted).length;
    const hint = msg || (B.tut ? '青い仲間をタップして選ぼう。敵をタップすると移動範囲が見えます。' : '仲間をタップして行動。敵をタップで範囲表示。');
    UI.setPanel(`<div class="small">${hint}</div><div class="small dim" style="margin-top:4px">未行動 ${left}人 / 薬草 ${B.herbs}</div>
      <div class="acts"><button class="btn" data-a="danger">${this.danger ? '範囲を消す' : '敵の範囲'}</button><button class="btn" data-a="list">部隊</button><button class="btn" data-a="next">次の仲間</button><button class="btn y" data-a="end">ターン終了</button></div>`,
      {
        danger: () => { this.danger = !this.danger; if (this.danger) this.calcDanger(); this.panelIdle(); },
        list: () => this.unitList(),
        next: () => { const u = this.alive('P').find(v => !v.acted); if (u) this.select(u); },
        end: async () => {
          if (this.alive('P').some(v => !v.acted) && !(await UI.confirm('まだ行動していない仲間がいます。ターンを終了しますか？', '終了する', 'やめる'))) return;
          this.endTurn();
        },
      });
  },
  calcDanger() {
    const s = new Set();
    for (const e of this.alive('E')) for (const k of R.threat(this.B, e)) s.add(k);
    this.dangerSet = s;
  },
  statsHtml(u) {
    const v = k => R.st(u, k);
    return `<div class="stats"><span><b>力</b>${v('str')}</span><span><b>魔力</b>${v('mag')}</span><span><b>技</b>${v('skl')}</span><span><b>速さ</b>${v('spd')}</span>
      <span><b>幸運</b>${v('lck')}</span><span><b>守備</b>${v('def')}</span><span><b>魔防</b>${v('res')}</span><span><b>移動</b>${R.mov(u)}</span></div>`;
  },
  wpnName(u) {
    if (R.isStaff(u)) return '杖（回復）';
    if (R.isMagic(u)) return R.atkSpells(u).map(id => SPELL[id].n).join('・') || '魔法なし';
    return R.weapon(u).n;
  },
  card(u, extra = '') {
    const c = CLS[u.cls];
    return `<div class="uinfo"><canvas data-spr="${c.sp}|${u.side}|${u.hair}"></canvas><div class="grow">
      <div class="nm">${U.esc(u.n)} <span class="dim small">${c.n} Lv${u.lv}${u.side === 'P' ? ' EXP' + u.exp : ''}</span>${u.boss ? ' <span class="red small">ボス</span>' : ''}${u.side === 'N' ? ' <span class="grn small">友軍</span>' : ''}</div>
      <div class="row" style="flex-wrap:nowrap"><span style="white-space:nowrap">HP ${u.hp}/${u.mhp}</span><div class="grow">${UI.hpBar(u.hp, u.mhp)}</div></div>
      ${this.statsHtml(u)}
      <div class="small dim">${U.esc(this.wpnName(u))}${u.item && ITEM[u.item].t !== 'wpn' ? ' ／ ' + ITEM[u.item].n : ''}</div>${extra}</div></div>`;
  },
  showInfo(u) {
    this.info = u;
    UI.setPanel(this.card(u) + `<div class="row end" style="margin-top:4px"><button class="btn sm" data-a="det">くわしく</button><button class="btn sm" data-a="back">とじる</button></div>`,
      { det: () => this.detail(u), back: () => { this.info = null; this.panelIdle(); } });
  },
  select(u) {
    const B = this.B;
    this.toNone();
    this.sel = u;
    this.origin = { x: u.x, y: u.y };
    this.rc = R.reach(B, u);
    const stands = [...this.rc.values()].filter(n => !n.block);
    this.moveSet = new Set(stands.map(n => U.key(n.x, n.y)));
    const maxR = R.maxRange(u);
    const hit = maxR ? R.hitTiles(B, stands, R.minRange(u), maxR) : new Set();
    this.atkSet = new Set([...hit].filter(k => !this.moveSet.has(k)));
    this.stage = 'sel';
    Snd.sfx('sel');
    UI.setPanel(this.card(u) +
      `<div class="row" style="flex-wrap:nowrap;align-items:center;gap:6px;margin-top:4px"><div class="small yel grow" style="min-width:0">${B.tut ? '青いマスへ移動、赤いマスの敵をタップで攻撃。' : '移動先をタップ（自分のマスでその場）'}</div><button class="btn sm" data-a="det">くわしく</button><button class="btn sm" data-a="cancel">キャンセル</button></div>`,
      { det: () => this.detail(u), cancel: () => this.toIdle() });
  },
  // best tile from which unit u can attack t (or null)
  standFor(u, t) {
    let best = null;
    for (const n of this.rc.values()) {
      if (n.block) continue;
      const d = Math.abs(n.x - t.x) + Math.abs(n.y - t.y);
      if (!R.modes(u, false).some(m => R.inRange(m, d))) continue;
      const cm = R.modes(t, true)[0];
      const ctr = cm && R.inRange(cm, d);
      const tr = R.terr(this.B, n.x, n.y);
      const sc = (n.x === this.origin.x && n.y === this.origin.y ? 500 : 0) + (ctr ? 0 : 60) + (R.isFly(u) ? 0 : tr.avo + tr.def * 5) - n.c;
      if (!best || sc > best.sc) best = { x: n.x, y: n.y, sc };
    }
    return best;
  },
  async moveUnit(u, x, y, warp) {
    if (u.x === x && u.y === y) return;
    if (warp) {
      Snd.sfx('warp');
      this.anim[u.id] = { x: u.x, y: u.y, a: 1 };
      await this.tween(220, p => { this.anim[u.id].a = 1 - p; });
      u.x = x; u.y = y;
      this.anim[u.id] = { x, y, a: 0 };
      await this.tween(220, p => { this.anim[u.id].a = p; });
      delete this.anim[u.id];
      return;
    }
    const rc = R.reach(this.B, u);
    const path = R.path(rc, x, y);
    if (path.length < 2) { u.x = x; u.y = y; return; }
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], b = path[i];
      if (i % 2) Snd.sfx('step');
      await this.tween(60, p => { this.anim[u.id] = { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, a: 1 }; });
    }
    u.x = x; u.y = y;
    delete this.anim[u.id];
  },
  async moveTo(x, y, thenTarget) {
    const u = this.sel;
    this.busy = true;
    this.stage = 'moving';
    await this.moveUnit(u, x, y);
    u.moved = true;
    this.busy = false;
    this.actMenu();
    if (thenTarget) this.openFc(thenTarget, 'atk');
  },
  undoMove() {
    const u = this.sel;
    u.x = this.origin.x; u.y = this.origin.y; u.moved = false;
    this.select(u);
  },
  targetsAtk(u) {
    const out = [];
    for (const t of this.alive().filter(v => R.foe(v, u))) {
      const d = U.dist(u, t);
      if (R.modes(u, false).some(m => R.inRange(m, d))) out.push(t);
    }
    return out;
  },
  targetsHeal(u) {
    const out = [];
    const hs = R.healSpells(u).filter(id => u.hp > SPELL[id].cost);
    if (!hs.length) return out;
    for (const t of this.alive().filter(v => !R.foe(v, u) && v !== u && v.hp < v.mhp)) {
      const d = U.dist(u, t);
      if (hs.some(id => d >= SPELL[id].rng[0] && d <= SPELL[id].rng[1])) out.push(t);
    }
    return out;
  },
  talkTargets(u) {
    return this.alive().filter(t => t !== u && U.dist(u, t) === 1 && t.talk && [].concat(t.talk).includes(u.rid));
  },
  tradeTargets(u) { return this.alive('P').filter(t => t !== u && U.dist(u, t) === 1 && t.rid); },
  actMenu() {
    const B = this.B, u = this.sel;
    this.stage = 'act';
    this.tgt = null;
    const tile = B.grid[u.y][u.x];
    const atk = this.targetsAtk(u), hl = this.targetsHeal(u), tk = this.talkTargets(u), tr = this.tradeTargets(u);
    const btn = (a, t, on = true, cls = '') => `<button class="btn ${cls}" data-a="${a}" ${on ? '' : 'disabled'}>${t}</button>`;
    let h = '';
    if (atk.length) h += btn('atk', R.isMagic(u) ? '魔法' : '攻撃', true, 'r');
    if (hl.length) h += btn('heal', '回復', true, 'g');
    if (tk.length) h += btn('talk', '話す', true, 'y');
    if (tile === 'V') h += btn('visit', '訪問', true, 'y');
    if (tile === 'C') h += btn('chest', '宝箱', true, 'y');
    if (B.herbs > 0 && u.hp < u.mhp) h += btn('herb', `薬草(${B.herbs})`);
    if (tr.length) h += btn('trade', '交換');
    h += btn('wait', '待機');
    h += btn('back', '戻る');
    UI.setPanel(`<div class="row" style="flex-wrap:nowrap"><canvas data-spr="${CLS[u.cls].sp}|P|${u.hair}" style="width:28px;height:28px;image-rendering:pixelated"></canvas><span>${U.esc(u.n)}</span><span class="small dim">HP ${u.hp}/${u.mhp}</span><span class="small dim grow" style="text-align:right">${R.terr(B, u.x, u.y).n}</span></div>
      ${B.tut ? '<div class="small yel">行動を選んでください。</div>' : ''}<div class="acts">${h}</div>`, {
      atk: () => this.openFc(atk.sort((a, b) => a.hp - b.hp)[0], 'atk'),
      heal: () => this.openFc(hl.sort((a, b) => (a.hp / a.mhp) - (b.hp / b.mhp))[0], 'heal'),
      talk: () => { if (tk.length === 1) this.doTalk(tk[0]); else { this.stage = 'talk'; this.tlist = tk; UI.setPanel('<div>話しかける相手をタップ</div><div class="row end"><button class="btn" data-a="b">戻る</button></div>', { b: () => this.actMenu() }); } },
      visit: () => this.doVisit(),
      chest: () => this.doChest(),
      herb: () => this.doHerb(),
      trade: () => this.doTrade(tr),
      wait: () => this.endAction(),
      back: () => this.undoMove(),
    });
  },
  openFc(t, kind) {
    const u = this.sel;
    this.tgt = t;
    if (kind === 'heal') {
      this.stage = 'hfc';
      const d = U.dist(u, t);
      this.modeList = R.healSpells(u).filter(id => u.hp > SPELL[id].cost && d >= SPELL[id].rng[0] && d <= SPELL[id].rng[1]);
      if (!this.hsp || !this.modeList.includes(this.hsp)) this.hsp = this.modeList[0];
      return this.panelHeal();
    }
    this.stage = 'fc';
    const d = U.dist(u, t);
    this.modeList = R.modes(u, false).filter(m => R.inRange(m, d));
    if (!this.mode || !this.modeList.some(m => m.sp === this.mode.sp)) this.mode = this.modeList[0];
    else this.mode = this.modeList.find(m => m.sp === this.mode.sp);
    this.panelFc();
  },
  panelFc() {
    const B = this.B, u = this.sel, t = this.tgt, md = this.mode;
    const fc = R.forecast(B, u, t, md);
    const A = fc.a, D = fc.d;
    const n = s => s ? `${s.dmg}${s.n > 1 ? '<span class="yel">×' + s.n + '</span>' : ''}` : '－';
    const hpAfterU = Math.max(1, u.hp - fc.cost);
    const tabs = this.modeList.length > 1 ? `<div class="row" style="gap:4px;margin-bottom:4px;flex-wrap:nowrap;overflow-x:auto">${this.modeList.map((m, i) => `<button class="btn sm ${m.sp === md.sp ? 'y' : ''}" style="flex:0 0 auto" data-a="md" data-i="${i}">${SPELL[m.sp].n}<span class="small"> HP-${SPELL[m.sp].cost}</span></button>`).join('')}</div>` : '';
    const note = [fc.cost ? `<span class="pur">HP-${fc.cost}</span>` : '', !D ? '<span class="grn">反撃なし</span>' : '', A.eff ? '<span class="yel">特効</span>' : ''].filter(Boolean).join('　');
    UI.setPanel(`${tabs}<div class="row" style="flex-wrap:nowrap;align-items:stretch;gap:8px"><div class="fc grow" style="min-width:0">
      <div class="l blu">${U.esc(u.n)}</div><div class="c">${md.sp ? SPELL[md.sp].n : md.w.n}</div><div class="r red">${U.esc(t.n)}</div>
      <div class="l big">${fc.cost ? `<span class="pur">${hpAfterU}</span>` : u.hp}</div><div class="c">HP</div><div class="r big">${t.hp}</div>
      <div class="l big">${n(A)}</div><div class="c">威力</div><div class="r big">${n(D)}</div>
      <div class="l">${A.hit}%</div><div class="c">命中</div><div class="r">${D ? D.hit + '%' : '－'}</div>
      <div class="l">${A.crit}%</div><div class="c">会心</div><div class="r">${D ? D.crit + '%' : '－'}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px;justify-content:flex-end;flex:0 0 auto;width:96px"><button class="btn r" data-a="go" style="min-height:52px">攻撃する</button><button class="btn" data-a="back">戻る</button></div></div>
      ${note ? `<div class="small" style="margin-top:2px">${note}</div>` : ''}`, {
      md: d => { this.mode = this.modeList[+d.i]; this.panelFc(); },
      back: () => this.actMenu(),
      go: () => this.doAttack(),
    });
  },
  panelHeal() {
    const u = this.sel, t = this.tgt, id = this.hsp, sp = SPELL[id];
    const amt = R.healAmt(u, id, t);
    const tabs = this.modeList.length > 1 ? `<div class="row" style="gap:4px;margin-bottom:4px;flex-wrap:nowrap;overflow-x:auto">${this.modeList.map((m, i) => `<button class="btn sm ${m === id ? 'y' : ''}" style="flex:0 0 auto" data-a="md" data-i="${i}">${SPELL[m].n}</button>`).join('')}</div>` : '';
    UI.setPanel(`${tabs}<div class="row" style="flex-wrap:nowrap;align-items:stretch;gap:8px"><div class="fc grow" style="min-width:0"><div class="l blu">${U.esc(u.n)}</div><div class="c">${sp.n}</div><div class="r grn">${U.esc(t.n)}</div>
      <div class="l big"><span class="pur">${u.hp}→${u.hp - sp.cost}</span></div><div class="c">HP</div><div class="r big"><span class="grn">${t.hp}→${t.hp + amt}</span></div></div>
      <div style="display:flex;flex-direction:column;gap:6px;justify-content:flex-end;flex:0 0 auto;width:96px"><button class="btn g" data-a="go" style="min-height:52px">回復する</button><button class="btn" data-a="back">戻る</button></div></div>
      <div class="small pur" style="margin-top:2px">使うとHPが${sp.cost}減ります</div>`, {
      md: d => { this.hsp = this.modeList[+d.i]; this.panelHeal(); },
      back: () => this.actMenu(),
      go: () => this.doHeal(),
    });
  },
  async doAttack() {
    const u = this.sel, t = this.tgt, md = this.mode;
    this.busy = true;
    this.stage = 'busy';
    UI.setPanel('');
    await this.attack(u, t, md);
    if (this.ended) return;
    this.endAction();
  },
  async doHeal() {
    const u = this.sel, t = this.tgt;
    this.busy = true;
    this.stage = 'busy';
    UI.setPanel('');
    await this.heal(u, t, this.hsp);
    if (this.ended) return;
    this.endAction();
  },
  async heal(u, t, id) {
    const s = SPELL[id];
    const amt = R.healAmt(u, id, t);
    u.hp = Math.max(1, u.hp - s.cost);
    this.fxText(u.x, u.y, '-' + s.cost, '#c69cff');
    Snd.sfx('heal');
    await Time.wait(250);
    t.hp += amt;
    this.fxText(t.x, t.y, '+' + amt, '#7dff9a', true);
    await Time.wait(500);
    if (u.side === 'P') await this.giveExp(u, R.healExp(u));
  },
  endAction() {
    const u = this.sel;
    if (u) { u.acted = true; u.moved = true; }
    this.busy = false;
    this.sel = null;
    if (this.checkEnd()) return;
    this.snap(); Game.save();
    if (Cfg.autoEnd && !this.alive('P').some(v => !v.acted)) { this.endTurn(); return; }
    this.toIdle();
  },
  async doTalk(t) {
    const B = this.B, u = this.sel;
    this.busy = true; this.stage = 'busy'; UI.setPanel('');
    const key = u.rid + '>' + (t.recruit || t.tag || t.id);
    await Dialog.play((B.ev.talk && B.ev.talk[key]) || [[u.rid, '……'], [t.recruit || null, '……']]);
    t.talk = null;
    if (t.tag === 'father') { t.def = Math.max(0, t.def - 5); t.res = Math.max(0, t.res - 5); Snd.sfx('heal'); }
    if (t.recruit) {
      t.side = 'P'; t.acted = true; t.rid = t.recruit; t.ai = 'agg';
      t.g = CHAR[t.recruit].g.slice();
      if (!B.recruits.includes(t.recruit)) B.recruits.push(t.recruit);
      Snd.sfx('get');
      UI.toast(`${U.esc(t.n)}が仲間になった！`);
    }
    this.endAction();
  },
  async doVisit() {
    const B = this.B, u = this.sel;
    this.busy = true; this.stage = 'busy'; UI.setPanel('');
    const v = (B.ev.visit && B.ev.visit[U.key(u.x, u.y)]) || { lines: [[null, '村人たちは家の奥に身をひそめている。']] };
    await Dialog.play(v.lines);
    await this.reward(v);
    B.grid[u.y][u.x] = 'v';
    this.buildMap();
    this.endAction();
  },
  async doChest() {
    const B = this.B, u = this.sel;
    this.busy = true; this.stage = 'busy'; UI.setPanel('');
    const v = (B.ev.chest && B.ev.chest[U.key(u.x, u.y)]) || { herb: 1 };
    Snd.sfx('door');
    await this.reward(v);
    B.grid[u.y][u.x] = '_';
    this.buildMap();
    this.endAction();
  },
  async reward(v) {
    const B = this.B;
    if (v.item) { B.loot.push(v.item); Snd.sfx('get'); await UI.alert(`<span class="yel">${ITEM[v.item].n}</span>を手に入れた！<br><span class="small dim">${ITEM[v.item].d}（戦闘後に部隊の持ち物へ）</span>`); }
    if (v.herb) { B.herbs += v.herb; Snd.sfx('get'); await UI.alert(`薬草を${v.herb}つ手に入れた！`); }
  },
  async doHerb() {
    const B = this.B, u = this.sel;
    this.busy = true; this.stage = 'busy'; UI.setPanel('');
    const amt = Math.min(12, u.mhp - u.hp);
    u.hp += amt; B.herbs--;
    Snd.sfx('heal');
    this.fxText(u.x, u.y, '+' + amt, '#7dff9a', true);
    await Time.wait(500);
    this.endAction();
  },
  async doTrade(list) {
    const u = this.sel;
    let t = list[0];
    if (list.length > 1) {
      t = await UI.choose('誰と交換する？', list.map(v => ({ t: `${v.n}（${v.item ? ITEM[v.item].n : '持ち物なし'}）`, v })));
      if (!t) return;
    }
    const a = u.item, b = t.item;
    if (!a && !b) { UI.toast('2人とも持ち物がありません'); return; }
    if ((b && !R.canItemFit(u, b)) || (a && !R.canItemFit(t, a))) { UI.toast('その持ち物は装備できません'); return; }
    u.item = b; t.item = a;
    Snd.sfx('get');
    UI.toast(`${U.esc(u.n)}と${U.esc(t.n)}の持ち物を交換した`);
    this.actMenu();
  },

  // ---------------- combat ----------------
  async attack(a, d, mode) {
    const B = this.B;
    a.trig = true; d.trig = true;
    if ((a.boss || d.boss) && B.ev.boss && !B.fired.boss) { B.fired.boss = true; await Dialog.play(B.ev.boss); }
    const before = { a: a.hp, d: d.hp };
    const res = R.combat(B, a, d, mode, this.rng);
    B.rs = this.rng.get();
    await this.fightAnim(a, d, mode, res, before);
    for (const [u, t, who] of [[a, d, 'a'], [d, a, 'd']]) {
      if (u.side !== 'P' || u.hp <= 0) continue;
      const mine = res.log.filter(l => l.who === who);
      const e = mine.length ? R.expFor(u, t, mine.some(l => l.hit), t.hp <= 0) : (u.lv < 20 ? 1 : 0);
      await this.giveExp(u, e);
    }
    for (const u of [a, d]) if (u.hp <= 0) await this.onDeath(u);
    this.checkEnd();
  },
  async giveExp(u, e) {
    if (!e || u.hp <= 0) return;
    this.fxText(u.x, u.y, 'EXP+' + e, '#ffd84a');
    const ups = R.gainExp(u, e, this.rng);
    this.B.rs = this.rng.get();
    await Time.wait(350);
    for (const g of ups) await Game.lvUpModal(u, g);
  },
  async onDeath(u) {
    const B = this.B;
    u.gone = true;
    if (u.side === 'E') {
      if (u.drop) { B.loot.push(u.drop); Snd.sfx('get'); UI.toast(`<span class="yel">${ITEM[u.drop].n}</span>を手に入れた！`); await Time.wait(300); }
      if (u.boss && B.ev.bossDie && !B.fired.bossDie) { B.fired.bossDie = true; await Dialog.play(B.ev.bossDie); }
      return;
    }
    if (u.side === 'P') {
      const die = (B.ev.die && B.ev.die[u.rid]) || (CHAR[u.rid] && CHAR[u.rid].die && [[u.rid, CHAR[u.rid].die]]) || [[u.rid, '……ここまで、か……']];
      if (u.lead || Game.G.mode === 'classic') await Dialog.play(die);
      if (!u.lead) {
        if (Game.G.mode === 'classic') { B.dead.push(u.rid); UI.toast(`${U.esc(u.n)}は倒れた…`); }
        else UI.toast(`${U.esc(u.n)}は傷つき、戦場を離れた（戦闘後に戻ります）`);
      }
    }
    if (u.side === 'N' && u.recruit && B.ev.npcDie) await Dialog.play(B.ev.npcDie);
  },
  // combat close-up
  async fightAnim(a, d, mode, res, before) {
    const F = { a, d, mode, res, L: a.side === 'E' ? d : a };
    F.R = F.L === a ? d : a;
    F.hp = { [a.id]: before.a, [d.id]: before.d };
    F.off = { [a.id]: 0, [d.id]: 0 };
    F.flash = { [a.id]: 0, [d.id]: 0 };
    F.alpha = { [a.id]: 1, [d.id]: 1 };
    F.texts = []; F.proj = null; F.white = 0; F.open = 0;
    F.fc = res.fc;
    if (!Cfg.anim) {
      // quick: numbers on the map only
      if (res.cost) this.fxText(a.x, a.y, '-' + res.cost, '#c69cff');
      for (const l of res.log) {
        const tgt = l.who === 'a' ? d : a;
        this.fxText(tgt.x, tgt.y, l.hit ? String(l.dmg) : 'ミス', l.crit ? '#ffd84a' : l.hit ? '#fff' : '#9ab', l.crit);
        Snd.sfx(l.hit ? (l.crit ? 'crit' : l.dmg ? 'hit' : 'nodmg') : 'miss');
        await Time.wait(260);
      }
      if (a.hp <= 0 || d.hp <= 0) Snd.sfx('die');
      await Time.wait(200);
      return;
    }
    this.fight = F;
    await this.tween(160, p => { F.open = p; });
    if (res.cost) {
      F.texts.push({ id: a.id, text: 'HP-' + res.cost, color: '#c69cff', t0: performance.now() });
      Snd.sfx('magic');
      await this.tween(200, p => { F.hp[a.id] = before.a - res.cost * p; });
      F.hp[a.id] = before.a - res.cost;
      await Time.wait(150);
    }
    for (const l of res.log) {
      const s = l.who === 'a' ? a : d, t = s === a ? d : a;
      const md = s === a ? mode : R.modes(d, true)[0];
      const kind = md.sp ? SPELL[md.sp].k : md.w.k;
      const dir = s === F.L ? 1 : -1;
      if (kind === 'bow') {
        Snd.sfx('arrow');
        F.proj = { k: 'arrow', from: s.id, to: t.id, p: 0 };
        await this.tween(200, p => { F.proj.p = p; });
        F.proj = null;
      } else if (md.sp) {
        Snd.sfx('magic');
        await this.tween(120, p => { F.off[s.id] = -dir * 0.04 * Math.sin(p * Math.PI); });
        F.proj = { k: kind, from: s.id, to: t.id, p: 0 };
        await this.tween(kind === 'thunder' ? 180 : 260, p => { F.proj.p = p; });
        F.proj = null;
      } else {
        Snd.sfx('swing');
        await this.tween(120, p => { F.off[s.id] = dir * 0.22 * p; });
      }
      if (l.hit) {
        Snd.sfx(l.crit ? 'crit' : l.dmg ? 'hit' : 'nodmg');
        F.flash[t.id] = 1;
        if (l.crit) F.white = 1;
        F.texts.push({ id: t.id, text: String(l.dmg), color: l.crit ? '#ffd84a' : '#ffffff', big: l.crit, t0: performance.now() });
        if (l.crit) F.texts.push({ id: t.id, text: '会心！', color: '#ffd84a', t0: performance.now(), dy: -1 });
        const from = F.hp[t.id], to = t === a ? l.hpA : l.hpD;
        await this.tween(260, p => { F.hp[t.id] = from + (to - from) * p; F.flash[t.id] = p < 0.3 ? 1 : 0; F.white = l.crit ? Math.max(0, 1 - p * 2) : 0; F.off[t.id] = -dir * 0.03 * Math.sin(p * Math.PI * 4) * (1 - p); });
        F.hp[t.id] = to; F.flash[t.id] = 0; F.white = 0; F.off[t.id] = 0;
      } else {
        Snd.sfx('miss');
        F.texts.push({ id: t.id, text: 'ミス', color: '#a8c0e0', t0: performance.now() });
        await this.tween(200, p => { F.off[t.id] = -dir * 0.12 * Math.sin(p * Math.PI); });
        F.off[t.id] = 0;
      }
      if (!md.sp && kind !== 'bow') await this.tween(120, p => { F.off[s.id] = dir * 0.22 * (1 - p); });
      F.off[s.id] = 0;
      await Time.wait(140);
    }
    if (a.hp <= 0 || d.hp <= 0) {
      Snd.sfx('die');
      await this.tween(450, p => { if (a.hp <= 0) F.alpha[a.id] = 1 - p; if (d.hp <= 0) F.alpha[d.id] = 1 - p; });
    }
    await Time.wait(320);
    await this.tween(140, p => { F.open = 1 - p; });
    this.fight = null;
  },

  // ---------------- input ----------------
  onTap(px, py) {
    if (!this.B || this.busy || Dialog.active || this.fight || this.ended) return;
    if (UI.ovEl.querySelector('.modal')) return;
    const B = this.B;
    const { x, y } = this.tileOf(px, py);
    const inMap = x >= 0 && y >= 0 && x < B.w && y < B.h;
    const u = inMap ? this.at(x, y) : null;
    switch (this.stage) {
      case 'deploy': {
        if (!u || u.side !== 'P') { this.swapSel = null; return; }
        if (!this.swapSel) { this.swapSel = u; Snd.sfx('sel'); return; }
        if (this.swapSel === u) { this.swapSel = null; return; }
        const a = this.swapSel;
        [a.x, u.x] = [u.x, a.x]; [a.y, u.y] = [u.y, a.y];
        this.swapSel = null; Snd.sfx('step');
        return;
      }
      case 'idle': {
        if (!u) { if (inMap) UI.setPanel(`<div>${R.terr(B, x, y).n}</div><div class="small dim">回避+${R.terr(B, x, y).avo}　守備+${R.terr(B, x, y).def}${R.terr(B, x, y).heal ? '　毎ターンHP回復' : ''}</div><div class="row end"><button class="btn sm" data-a="b">とじる</button></div>`, { b: () => this.panelIdle() }); return; }
        if (u.side === 'P' && !u.acted) { this.select(u); return; }
        if (u.side === 'E') { if (this.shown.has(u.id)) this.shown.delete(u.id); else this.shown.add(u.id); Snd.sfx('tick'); }
        this.showInfo(u);
        return;
      }
      case 'sel': {
        const su = this.sel;
        if (!inMap) { this.toIdle(); return; }
        const k = U.key(x, y);
        if (u && u === su) { this.moveTo(su.x, su.y); return; }
        if (u && R.foe(u, su)) {
          const st = this.standFor(su, u);
          if (st) { this.moveTo(st.x, st.y, u); return; }
          this.showInfo(u); this.toIdle(); this.showInfo(u); return;
        }
        if (u && u.side === 'P' && !u.acted) { this.select(u); return; }
        if (this.moveSet.has(k) && !u) { this.moveTo(x, y); return; }
        this.toIdle();
        return;
      }
      case 'act': case 'fc': case 'hfc': {
        if (!u) return;
        const su = this.sel;
        if (R.foe(u, su) && this.targetsAtk(su).includes(u)) { this.openFc(u, 'atk'); return; }
        if (!R.foe(u, su) && this.targetsHeal(su).includes(u)) { this.openFc(u, 'heal'); return; }
        return;
      }
      case 'talk': { if (u && this.tlist && this.tlist.includes(u)) this.doTalk(u); return; }
    }
  },
  onLong(px, py) {
    if (!this.B || this.busy || Dialog.active || this.fight) return;
    const { x, y } = this.tileOf(px, py);
    const u = this.at(x, y);
    if (u) this.detail(u);
  },

  // ---------------- menus ----------------
  menu() {
    if (this.busy && !this.ended) { UI.toast('行動中は開けません'); return; }
    if (this.ended) return;
    UI.modal(`<h3>メニュー</h3><div class="list">
      <button class="btn" data-a="list">部隊を見る</button>
      <button class="btn" data-a="help">遊び方</button>
      <button class="btn" data-a="cfg">設定</button>
      <button class="btn" data-a="retry">この戦闘をはじめからやり直す</button>
      <button class="btn" data-a="quit">中断してタイトルへ（続きから再開できます）</button>
      <button class="btn y" data-a="close">とじる</button></div>`, {
      list: (d, b, m) => { m.close(); this.unitList(); },
      help: (d, b, m) => { m.close(); Game.help(); },
      cfg: (d, b, m) => { m.close(); Game.settings(); },
      retry: async (d, b, m) => { m.close(); if (await UI.confirm('この戦闘を最初からやり直しますか？（この戦闘での成長は失われます）', 'やり直す', 'やめる')) Game.retryBattle(); },
      quit: (d, b, m) => { m.close(); this.save(); Game.toTitle(); },
      close: (d, b, m) => m.close(),
    });
  },
  unitList() {
    const list = this.B.units.filter(u => u.side === 'P' && (u.hp > 0 && !u.gone));
    const html = `<h3>部隊</h3><div class="ulist">${list.map((u, i) => `<button class="urow btn" data-a="u" data-i="${i}" style="text-align:left">
      <canvas data-spr="${CLS[u.cls].sp}|P|${u.hair}|${u.acted ? 1 : 0}"></canvas><div class="grow"><div>${U.esc(u.n)} <span class="small dim">${CLS[u.cls].n} Lv${u.lv}</span></div>${UI.hpBar(u.hp, u.mhp)}</div><span class="small">${u.hp}/${u.mhp}</span></button>`).join('')}</div>
      <div class="row end" style="margin-top:8px"><button class="btn" data-a="close">とじる</button></div>`;
    UI.modal(html, { u: (d, b, m) => { m.close(); this.detail(list[+d.i]); }, close: (d, b, m) => m.close() });
  },
  detail(u) { Game.statusModal(u, true); },

  // ---------------- drawing ----------------
  draw(ctx, t) {
    const B = this.B;
    if (!B) return;
    const T = this.T, ox = this.ox, oy = this.oy;
    ctx.fillStyle = '#05060f';
    ctx.fillRect(0, 0, View.W, View.H);
    ctx.drawImage(this.maps[Math.floor(t / 650) % 2], ox, oy, B.w * T, B.h * T);
    if (B.night) { ctx.fillStyle = 'rgba(16,24,72,0.30)'; ctx.fillRect(ox, oy, B.w * T, B.h * T); }
    const tint = (keys, col, border) => {
      ctx.fillStyle = col;
      for (const k of keys) { const [x, y] = k.split(',').map(Number); ctx.fillRect(ox + x * T + 1, oy + y * T + 1, T - 2, T - 2); }
      if (border) { ctx.strokeStyle = border; ctx.lineWidth = Math.max(1, T / 24); for (const k of keys) { const [x, y] = k.split(',').map(Number); ctx.strokeRect(ox + x * T + 2, oy + y * T + 2, T - 4, T - 4); } }
    };
    if (this.danger && this.dangerSet) tint(this.dangerSet, 'rgba(255,110,40,0.22)');
    for (const id of this.shown) {
      const e = B.units.find(v => v.id === id);
      if (!e || e.hp <= 0 || e.gone) continue;
      const ck = id + '@' + e.x + ',' + e.y + '#' + B.units.filter(v => v.hp > 0 && !v.gone).map(v => v.x + ',' + v.y).join(';');
      this.thMap = this.thMap || new Map();
      let th = this.thMap.get(ck);
      if (!th) { if (this.thMap.size > 40) this.thMap.clear(); th = R.threat(B, e); this.thMap.set(ck, th); }
      tint(th, 'rgba(255,60,60,0.2)', 'rgba(255,120,120,0.35)');
    }
    if (this.stage === 'sel' && this.moveSet) {
      tint(this.atkSet, 'rgba(255,70,70,0.36)');
      const pulse = 0.38 + 0.08 * Math.sin(t / 220);
      tint(this.moveSet, `rgba(70,140,255,${pulse})`, 'rgba(170,210,255,0.5)');
    }
    if ((this.stage === 'act' || this.stage === 'fc' || this.stage === 'hfc') && this.sel) {
      const ts = this.targetsAtk(this.sel).map(v => U.key(v.x, v.y));
      tint(ts, 'rgba(255,60,60,0.42)', 'rgba(255,170,170,0.8)');
      const hs = this.targetsHeal(this.sel).map(v => U.key(v.x, v.y));
      tint(hs, 'rgba(60,220,110,0.4)', 'rgba(170,255,190,0.8)');
    }
    if (this.stage === 'talk' && this.tlist) tint(this.tlist.map(v => U.key(v.x, v.y)), 'rgba(255,220,60,0.45)');
    if (this.stage === 'deploy') {
      tint(this.alive('P').map(v => U.key(v.x, v.y)), 'rgba(70,140,255,0.3)');
      if (this.swapSel) tint([U.key(this.swapSel.x, this.swapSel.y)], 'rgba(255,220,60,0.5)');
    }
    // units
    const us = B.units.filter(u => (u.hp > 0 && !u.gone) || (this.fight && (u === this.fight.a || u === this.fight.d)));
    us.sort((a, b) => (this.anim[a.id] ? this.anim[a.id].y : a.y) - (this.anim[b.id] ? this.anim[b.id].y : b.y));
    const bob = Math.floor(t / 480) % 2;
    for (const u of us) {
      const an = this.anim[u.id];
      const ux = an ? an.x : u.x, uy = an ? an.y : u.y;
      const px = ox + ux * T, py = oy + uy * T;
      ctx.globalAlpha = an ? an.a : 1;
      const base = u.side === 'E' ? 'rgba(255,60,60,0.55)' : u.side === 'N' ? 'rgba(60,220,110,0.55)' : 'rgba(80,150,255,0.6)';
      ctx.fillStyle = base;
      ctx.beginPath(); ctx.ellipse(px + T / 2, py + T * 0.88, T * 0.36, T * 0.11, 0, 0, 7); ctx.fill();
      const gray = u.side === 'P' && u.acted && B.phase === 'P';
      const spr = SP.get(CLS[u.cls].sp, u.side, u.hair, { gray, flip: u.side === 'E' });
      const by = (!gray && bob && !an) ? -Math.round(T / 16) : 0;
      ctx.drawImage(spr, px, py + by, T, T);
      if (u.hp < u.mhp) {
        const bw = T * 0.8, bh = Math.max(2, Math.round(T / 12));
        ctx.fillStyle = '#000'; ctx.fillRect(px + T * 0.1 - 1, py + T - bh - 2, bw + 2, bh + 2);
        const r = u.hp / u.mhp;
        ctx.fillStyle = r > 0.5 ? '#4ee07a' : r > 0.25 ? '#f0b030' : '#ff4a4a';
        ctx.fillRect(px + T * 0.1, py + T - bh - 1, bw * r, bh);
      }
      if (u.boss) { ctx.fillStyle = '#ffd84a'; ctx.font = `${Math.round(T * 0.32)}px sans-serif`; ctx.fillText('★', px + 1, py + T * 0.3); }
      if (u.talk && B.phase === 'P' && u.side !== 'P') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(px + T * 0.82, py + T * 0.16, T * 0.16, T * 0.12, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#333'; ctx.font = `${Math.round(T * 0.2)}px sans-serif`; ctx.fillText('…', px + T * 0.7, py + T * 0.21); }
      ctx.globalAlpha = 1;
    }
    // selection cursor
    const cur = this.sel || this.swapSel || this.info;
    if (cur && cur.hp > 0) {
      const an = this.anim[cur.id];
      const cx = ox + (an ? an.x : cur.x) * T, cy = oy + (an ? an.y : cur.y) * T;
      const s = Math.max(2, Math.round(T / 10)), L = Math.round(T * 0.3);
      ctx.fillStyle = (Math.floor(t / 250) % 2) ? '#ffffff' : '#ffd84a';
      for (const [x0, y0, dx, dy] of [[cx, cy, 1, 1], [cx + T, cy, -1, 1], [cx, cy + T, 1, -1], [cx + T, cy + T, -1, -1]]) {
        ctx.fillRect(dx > 0 ? x0 : x0 - L, dy > 0 ? y0 : y0 - s, L, s);
        ctx.fillRect(dx > 0 ? x0 : x0 - s, dy > 0 ? y0 : y0 - L, s, L);
      }
    }
    if (this.tgt && (this.stage === 'fc' || this.stage === 'hfc')) {
      const tt = this.tgt;
      ctx.strokeStyle = (Math.floor(t / 200) % 2) ? '#ff5a5a' : '#ffffff';
      ctx.lineWidth = Math.max(2, T / 12);
      ctx.strokeRect(ox + tt.x * T + 2, oy + tt.y * T + 2, T - 4, T - 4);
    }
    // floating texts
    const now = performance.now();
    this.fx = this.fx.filter(f => now - f.t0 < 1000);
    for (const f of this.fx) {
      const p = (now - f.t0) / 1000;
      ctx.globalAlpha = 1 - p * p;
      ctx.font = `${Math.round(T * (f.big ? 0.62 : 0.42))}px DotGothic16, sans-serif`;
      ctx.textAlign = 'center';
      const x = ox + f.x * T + T / 2, y = oy + f.y * T + T * 0.35 - p * T * 0.6;
      ctx.lineWidth = Math.max(2, T / 10); ctx.strokeStyle = '#000'; ctx.strokeText(f.text, x, y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
    if (this.fight) this.drawFight(ctx, t);
  },
  drawFight(ctx, t) {
    const F = this.fight, W = View.W, H = View.H;
    const o = F.open;
    ctx.fillStyle = `rgba(0,0,10,${0.6 * o})`;
    ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W * 0.96, H * 1.25), ph = Math.min(H * 0.72, pw * 0.8);
    const px = (W - pw) / 2, py = (H - ph) / 2 + (1 - o) * ph * 0.3;
    ctx.globalAlpha = o;
    // background by right unit's terrain
    const tr = R.terr(this.B, F.R.x, F.R.y);
    const sky = { forest: ['#1e4a2a', '#2e6a3a'], mount: ['#4a3a2a', '#7a6040'], water: ['#1a3a6a', '#2a5a9a'], sand: ['#6a5a3a', '#a08a5a'], fort: ['#3a3a4a', '#5a5a6a'], plain: ['#2a4a6a', '#3a7a4a'] }[tr.c] || ['#2a3a5a', '#3a6a3a'];
    const indoor = ['indoor', 'cave', 'crypt', 'tower'].includes(this.B.style);
    const gr = ctx.createLinearGradient(0, py, 0, py + ph);
    gr.addColorStop(0, indoor ? '#1a1828' : sky[0]); gr.addColorStop(0.62, indoor ? '#2e2a3e' : sky[1]); gr.addColorStop(0.62, indoor ? '#4a4038' : '#4a7a3a'); gr.addColorStop(1, indoor ? '#2e2620' : '#2a4a22');
    ctx.fillStyle = gr; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#eef0ff'; ctx.lineWidth = Math.max(2, View.dpr * 2); ctx.strokeRect(px, py, pw, ph);
    // sprites
    const sc = Math.max(2, Math.floor(Math.min(pw * 0.3, ph * 0.5) / 16));
    const S = 16 * sc;
    const groundY = py + ph * 0.62;
    const draw = (u, side) => {
      const xBase = side < 0 ? px + pw * 0.25 - S / 2 : px + pw * 0.75 - S / 2;
      const x = xBase + F.off[u.id] * pw;
      const y = groundY - S + sc * 2;
      ctx.globalAlpha = o * F.alpha[u.id];
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(x + S / 2, groundY + sc, S * 0.36, sc * 2.2, 0, 0, 7); ctx.fill();
      const spr = SP.get(CLS[u.cls].sp, u.side, u.hair, { flip: side > 0, white: F.flash[u.id] > 0 });
      ctx.drawImage(spr, x, y, S, S);
      ctx.globalAlpha = o;
      u._fx = x + S / 2; u._fy = y + S * 0.4;
    };
    draw(F.L, -1); draw(F.R, 1);
    // projectile
    if (F.proj) {
      const s = F.proj.from === F.L.id ? F.L : F.R, d = F.proj.from === F.L.id ? F.R : F.L;
      const p = F.proj.p;
      const x = s._fx + (d._fx - s._fx) * p, y = s._fy + (d._fy - s._fy) * p;
      const r = S * 0.12;
      switch (F.proj.k) {
        case 'arrow': ctx.strokeStyle = '#f0e0c0'; ctx.lineWidth = sc; ctx.beginPath(); ctx.moveTo(x - Math.sign(d._fx - s._fx) * S * 0.25, y); ctx.lineTo(x, y); ctx.stroke(); break;
        case 'fire': ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(x, y, r * 1.4, 0, 7); ctx.fill(); ctx.fillStyle = '#ffe07a'; ctx.beginPath(); ctx.arc(x, y, r * 0.7, 0, 7); ctx.fill(); break;
        case 'dark': ctx.fillStyle = '#6a2aaa'; ctx.beginPath(); ctx.arc(x, y, r * 1.4, 0, 7); ctx.fill(); ctx.fillStyle = '#d8a8ff'; ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, 7); ctx.fill(); break;
        case 'wind': ctx.strokeStyle = '#bff4ff'; ctx.lineWidth = sc; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x - i * r * 2 * Math.sign(d._fx - s._fx), y + (i - 1) * r, r * 1.5, -1, 1); ctx.stroke(); } break;
        case 'thunder': { ctx.strokeStyle = (Math.floor(t / 40) % 2) ? '#ffffff' : '#ffe84a'; ctx.lineWidth = sc * 1.2; ctx.beginPath(); let yy = py; let xx = d._fx; ctx.moveTo(xx, yy); while (yy < d._fy) { yy += S * 0.18; xx = d._fx + (Math.random() - 0.5) * S * 0.3; ctx.lineTo(xx, yy); } ctx.stroke(); break; }
        case 'light': { ctx.strokeStyle = '#fffbe0'; ctx.lineWidth = sc * 1.2; ctx.beginPath(); ctx.arc(d._fx, d._fy, S * (0.1 + 0.5 * p), 0, 7); ctx.stroke(); ctx.strokeStyle = '#ffe07a'; ctx.beginPath(); ctx.arc(d._fx, d._fy, S * (0.05 + 0.3 * p), 0, 7); ctx.stroke(); break; }
        default: ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      }
    }
    if (F.white > 0) { ctx.fillStyle = `rgba(255,255,255,${0.7 * F.white})`; ctx.fillRect(px, py, pw, ph); }
    // floating texts
    const now = performance.now();
    F.texts = F.texts.filter(x => now - x.t0 < 900);
    for (const tx of F.texts) {
      const u = tx.id === F.L.id ? F.L : F.R;
      const p = (now - tx.t0) / 900;
      ctx.font = `${Math.round(S * (tx.big ? 0.42 : 0.3))}px DotGothic16, sans-serif`;
      ctx.textAlign = 'center';
      const y = (u._fy || groundY) - S * 0.3 - p * S * 0.35 + (tx.dy || 0) * S * 0.35;
      ctx.lineWidth = sc * 1.2; ctx.strokeStyle = '#000'; ctx.strokeText(tx.text, u._fx, y);
      ctx.fillStyle = tx.color; ctx.fillText(tx.text, u._fx, y);
      ctx.textAlign = 'left';
    }
    // info boxes
    const bh = ph * 0.3, by = py + ph - bh;
    const box = (u, side) => {
      const bx = side < 0 ? px : px + pw / 2;
      ctx.fillStyle = u.side === 'E' ? 'rgba(90,16,24,0.92)' : 'rgba(16,32,96,0.92)';
      ctx.fillRect(bx + 2, by, pw / 2 - 4, bh - 2);
      const fs = Math.round(Math.min(bh * 0.24, pw * 0.045));
      ctx.font = `${fs}px DotGothic16, sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.fillText(u.n, bx + fs * 0.6, by + fs * 1.2);
      const fcS = u === F.a ? F.fc.a : F.fc.d;
      const w = u === F.a ? (F.mode.sp ? SPELL[F.mode.sp].n : F.mode.w.n) : (R.modes(u, true)[0] ? (R.modes(u, true)[0].sp ? SPELL[R.modes(u, true)[0].sp].n : R.modes(u, true)[0].w.n) : '');
      ctx.fillStyle = '#c8d0ff'; ctx.font = `${Math.round(fs * 0.78)}px DotGothic16, sans-serif`;
      ctx.fillText(fcS ? `${w}　命${fcS.hit} 威${fcS.dmg} 会${fcS.crit}` : `${w}　反撃なし`, bx + fs * 0.6, by + fs * 2.35);
      const hp = Math.max(0, Math.round(F.hp[u.id]));
      ctx.font = `${fs}px DotGothic16, sans-serif`; ctx.fillStyle = '#fff';
      ctx.fillText(String(hp), bx + fs * 0.6, by + bh - fs * 0.6);
      const barX = bx + fs * 2.6, barW = pw / 2 - fs * 3.6, barH = Math.max(4, fs * 0.45), barY = by + bh - fs * 0.6 - barH;
      ctx.fillStyle = '#000'; ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      const r = Math.max(0, F.hp[u.id] / u.mhp);
      ctx.fillStyle = r > 0.5 ? '#4ee07a' : r > 0.25 ? '#f0b030' : '#ff4a4a';
      ctx.fillRect(barX, barY, barW * r, barH);
    };
    box(F.L, -1); box(F.R, 1);
    ctx.globalAlpha = 1;
  },
};

// ===================== game state, flow & menus =====================
const Cfg = Object.assign({ anim: 1, autoEnd: true, sfx: true, bgm: true, fast: false }, Store.get(CFG_KEY, {}));
function applyCfg() { Snd.sfxOn = Cfg.sfx; Snd.bgmOn = Cfg.bgm; Time.speed = Time.speed === 0 ? 0 : (Cfg.fast ? 2 : 1); }

const STORY = {};
const EVENTS = {};
// chapter flow. trial ends after chapter 1.
const FLOW = {
  intro: { story: 'intro', next: 'p_kai' },
  p_kai: { battle: 'p_kai', army: 'A', next: 'p_rise' },
  p_rise: { battle: 'p_rise', army: 'B', next: 'ch1' },
  ch1: { chapter: 1, card: ['第一章', 'ふたつの道'], story: 'ch1', next: 'world' },
  ch1end: { story: 'ch1end', next: 'ch2' },
  world: { world: true },
};

const Game = {
  G: null, slot: 0, t0: 0,
  // ---------- persistence ----------
  slots() {
    const s = Store.get(SAVE_KEY, null);
    if (!Array.isArray(s) || s.length !== 3) return [null, null, null];
    return s.map(v => (v && typeof v === 'object' && v.G && typeof v.G === 'object' && v.G.units && v.meta && typeof v.meta === 'object') ? v : null);
  },
  // can this edition open the slot? (the trial never opens a full-version record)
  canOpen(slot) { return !!slot && !(EDITION === 'trial' && (slot.meta.ed === 'full' || (slot.G.chapter || 0) >= 2)); },
  meta(G) {
    const where = G.step === 'cleared' ? '★クリア' : G.step === 'trialEnd' ? '体験版クリア' : G.battle ? G.battle.name : G.dungeon ? DUNGEONS[G.dungeon.id].n : (G.chapter ? (CHAPTER_NAME[G.chapter] || '') : '序章');
    return { ch: G.chapter, day: G.day, mode: G.mode, time: G.time, where, ts: Date.now(), ed: EDITION, lead: G.units.kai ? G.units.kai.lv : 1 };
  },
  save() {
    const G = Game.G;
    if (!G) return false;
    const now = Date.now();
    if (Game.t0) G.time += (now - Game.t0) / 1000;
    Game.t0 = now;
    const s = Game.slots();
    // during a battle only a consistent snapshot is written (start of the player phase / after a finished action)
    let rec = G;
    if (G.battle && Scene === Battle && Battle.safe) rec = Object.assign({}, G, { battle: JSON.parse(Battle.safe) });
    s[Game.slot] = { G: rec, meta: Game.meta(rec) };
    const ok = Store.set(SAVE_KEY, s);
    if (!ok && now - (Game.warnAt || 0) > 60000) {
      Game.warnAt = now;
      if (typeof UI !== 'undefined' && UI.ovEl) UI.toast('<span class="red">記録できませんでした</span><br><span class="small">ブラウザの保存領域がいっぱいか、保存できない設定です</span>');
    }
    return ok;
  },
  saveBattle(B) { Game.G.battle = B; Game.save(); },
  setArmyNode(a, id) { const G = Game.G; if (a === 'AB') { G.armies.A.node = id; G.armies.B.node = id; } else G.armies[a].node = id; },
  load(i) {
    const s = Game.slots()[i];
    if (!s) return false;
    Game.G = s.G;
    Game.slot = i;
    Game.t0 = Date.now();
    Game.migrate(Game.G);
    Game.run();
    return true;
  },
  migrate(G) {
    G.flags = G.flags || {}; G.cleared = G.cleared || {}; G.visited = G.visited || {}; G.roam = G.roam || []; G.fallen = G.fallen || [];
    // a trial save opened in the full version continues into chapter 2
    if (EDITION === 'full' && G.step === 'trialEnd') G.step = 'ch2';
    // a chapter whose goals are all cleared moves on (e.g. after an older version saved too early)
    if (EDITION === 'full' && G.step === 'world' && G.chapter >= 1 && G.chapter <= 4 && Game.chapterGoalsDone(G.chapter)) G.step = 'ch' + G.chapter + 'end';
  },
  newGame(slot, mode) {
    const G = {
      v: 1, mode, chapter: 0, day: 1, time: 0, step: 'intro', units: {}, cur: 'A',
      armies: { A: { node: 'hamabe', units: [] }, B: { node: 'shudoin', units: [] } },
      inv: { A: { items: [], herb: 1 }, B: { items: [], herb: 1 } },
      flags: {}, cleared: {}, visited: {}, roam: [], fallen: [], battle: null, battleStart: null, dungeon: null,
      seed: (Math.random() * 1e9) | 0,
    };
    Game.G = G; Game.slot = slot; Game.t0 = Date.now();
    ['kai', 'dorf', 'mio', 'tobi'].forEach(id => Game.join(id, 'A', true));
    ['rise', 'belt', 'noe'].forEach(id => Game.join(id, 'B', true));
    Game.save();
    Game.run();
  },
  join(id, army, silent) {
    const G = Game.G;
    if (!G.units[id]) G.units[id] = Units.fromChar(id);
    const u = G.units[id];
    u.army = army; u.alive = true;
    if (!G.armies[army].units.includes(id)) G.armies[army].units.push(id);
    return u;
  },
  armyUnits(a) {
    const G = Game.G;
    const ids = a === 'AB' ? G.armies.A.units.concat(G.armies.B.units) : G.armies[a].units;
    return ids.map(id => G.units[id]).filter(u => u && u.alive);
  },
  toTitle() { Game.save(); Game.G = null; go(Title); },

  // ---------- main dispatcher ----------
  async run() {
    const G = Game.G;
    applyCfg();
    if (G.battle) { go(Battle, G.battle); return; }
    if (G.dungeon) { go(NodeMap, 'dungeon'); return; }
    const f = FLOW[G.step] || FLOW.world;
    if (G.step === 'trialEnd') { go(TrialEnd); return; }
    if (G.step === 'cleared') { go(EndingScene); return; }
    if (f.battle) { Game.startBattle(MAPS[f.battle], f.army, { type: 'flow', next: f.next }); return; }
    if (f.story || f.card) {
      go(StoryScene, STORY[f.story] ? STORY[f.story].bg : 'sea');
      if (f.chapter) { G.chapter = f.chapter; Game.onChapter(f.chapter); }
      if (f.card) await Dialog.card(f.card[1], f.card[0]);
      if (STORY[f.story]) await Dialog.play(STORY[f.story].lines);
      let next = f.next;
      if (G.step === 'ch1end' && EDITION === 'trial') next = 'trialEnd';
      G.step = next;
      Game.save();
      Game.run();
      return;
    }
    go(NodeMap, 'world');
  },
  onChapter(ch) {
    const G = Game.G;
    setupRoam(ch, G);
    if (typeof onChapterFull === 'function') onChapterFull(ch, G);
  },
  chapterGoalsDone(ch) {
    const goals = Object.keys(WORLD.nodes).filter(k => WORLD.nodes[k].goal && WORLD.nodes[k].goal.endsWith(String(ch)));
    return goals.length && goals.every(k => Game.G.cleared[k]);
  },

  // ---------- battles ----------
  startBattle(md, army, ret, unitIds) {
    const G = Game.G;
    const go2 = ids => {
      // the army only moves onto the node once the battle really starts (cancelling the deployment keeps it where it was)
      if (ret && ret.moveTo) Game.setArmyNode(army, ret.moveTo);
      if (ret && ret.moveRoom && G.dungeon) G.dungeon.node = ret.moveRoom;
      const B = Game.makeBattle(md, army, ids, ret);
      G.battle = B;
      G.battleStart = U.clone(B);
      Battle.safe = null;
      Game.save();
      go(Battle, B);
    };
    const roster = Game.armyUnits(army);
    if (unitIds) return go2(unitIds);
    const slots = md.deploy.length;
    if (roster.length <= slots) return go2(roster.map(u => u.id));
    Game.prep(roster, slots, army).then(ids => { if (ids) go2(ids); else Game.run(); });
  },
  prep(roster, slots, army) {
    return new Promise(res => {
      const lead = roster.filter(u => u.lead).map(u => u.id);
      const on = new Set(roster.slice().sort((a, b) => (b.lead ? 1 : 0) - (a.lead ? 1 : 0) || R.effLv(b) - R.effLv(a)).slice(0, slots).map(u => u.id));
      let m;
      const render = () => {
        const html = `<h3>出撃する仲間を選ぶ（最大${slots}人）</h3><div class="ulist">${roster.map(u => `<button class="urow btn ${on.has(u.id) ? '' : 'off'}" data-a="t" data-id="${u.id}" style="text-align:left">
          <span class="chk">${on.has(u.id) ? '✓' : ''}</span><canvas data-spr="${CLS[u.cls].sp}|P|${u.hair}"></canvas><div class="grow">${U.esc(u.n)} <span class="small dim">${CLS[u.cls].n} Lv${u.lv}</span>${u.lead ? ' <span class="small yel">必須</span>' : ''}</div></button>`).join('')}</div>
          <div class="row end" style="margin-top:8px"><span class="dim small grow">${on.size}/${slots}人</span><button class="btn" data-a="no">やめる</button><button class="btn y" data-a="ok">出撃</button></div>`;
        if (m) m.close();
        m = UI.modal(html, {
          t: d => { if (lead.includes(d.id)) return; if (on.has(d.id)) on.delete(d.id); else if (on.size < slots) on.add(d.id); render(); },
          ok: () => { m.close(); res([...on]); },
          no: () => { m.close(); res(null); },
        }, { dismiss: false });
      };
      render();
    });
  },
  makeBattle(md, army, ids, ret) {
    const G = Game.G;
    const B = {
      name: md.name, card: md.card || null, w: md.grid[0].length, h: md.grid.length, grid: md.grid.map(r => r.split('')),
      style: md.style || 'field', night: !!md.night, bgm: md.bgm || 'battle', obj: md.obj, army, ret,
      units: [], turn: 1, phase: 'P', started: false, rs: (G.seed + G.day * 7919 + Object.keys(G.cleared).length * 104729) | 0,
      ev: U.clone(md.ev || {}), fired: {}, loot: [], recruits: [], dead: [], herbs: G.inv[army === 'AB' ? 'A' : army].herb,
      tut: !!md.tut, noDeploy: !!md.noDeploy,
    };
    // leaders first in deploy order
    const units = ids.map(id => G.units[id]).sort((a, b) => (b.lead ? 1 : 0) - (a.lead ? 1 : 0));
    units.forEach((r, i) => { const p = md.deploy[i]; if (p) B.units.push(Units.toBattle(r, p[0], p[1])); });
    for (const s of md.enemies || []) B.units.push(Units.enemy(s));
    for (const s of md.npc || []) B.units.push(Units.enemy(Object.assign({ side: 'N' }, s)));
    // recruits that already joined never appear again
    B.units = B.units.filter(u => !(u.recruit && u.side !== 'P' && G.units[u.recruit]));
    return B;
  },
  makeEncounter(tplId, pool, lv, n, army, ret, name) {
    const t = ENC[tplId];
    const r = U.rngFrom((Game.G.seed ^ (Game.G.day * 2654435761)) >>> 0);
    const spots = U.shuffle(t.spawn, r).slice(0, n);
    const enemies = spots.map(([x, y], i) => ({ c: U.pick(pool, r), lv: Math.max(1, lv + (r() < 0.3 ? 1 : 0) - (r() < 0.2 ? 1 : 0)), x, y, ai: i % 3 === 2 ? 'hold' : 'agg' }));
    return { name: name || '遭遇戦', style: t.style, grid: t.grid, deploy: t.deploy, enemies, obj: { type: 'rout', text: '敵をすべて倒す' }, ev: {} };
  },
  retryBattle() {
    const G = Game.G;
    if (!G.battleStart) { Game.run(); return; }
    G.battle = U.clone(G.battleStart);
    Game.save();
    go(Battle, G.battle);
  },
  finishBattle(B) {
    const G = Game.G;
    const army = B.army;
    // write growth back to the roster
    for (const u of B.units) {
      if (u.side !== 'P' || !u.rid) continue;
      let r = G.units[u.rid];
      if (!r) r = Game.join(u.rid, army === 'AB' ? (CHAR[u.rid].army || 'A') : army);
      for (const k of ['lv', 'exp', 'cls', 'item', 'mhp', 'str', 'mag', 'skl', 'spd', 'lck', 'def', 'res']) r[k] = u[k];
      r.hp = r.mhp;
      const dead = B.dead.includes(u.rid);
      r.alive = !dead;
      if (dead && !G.fallen.includes(u.rid)) G.fallen.push(u.rid);
    }
    for (const u of B.units) {
      if (u.side === 'N' && u.join && u.hp > 0 && !u.gone && u.recruit && !G.units[u.recruit]) {
        const r = Game.join(u.recruit, army === 'AB' ? 'A' : army);
        for (const k of ['lv', 'exp', 'mhp', 'str', 'mag', 'skl', 'spd', 'lck', 'def', 'res']) r[k] = u[k];
        r.hp = r.mhp;
      }
    }
    const inv = G.inv[army === 'AB' ? 'A' : army];
    for (const it of B.loot) inv.items.push(it);
    inv.herb = B.herbs;
    const ret = B.ret || {};
    G.battle = null; G.battleStart = null;
    G.lastWin = B.name;
    if (ret.type === 'flow') G.step = ret.next;
    else if (ret.type === 'node') {
      G.cleared[ret.node] = true;
      if (G.step === 'world') for (let ch = 1; ch <= 4; ch++) if (G.chapter === ch && Game.chapterGoalsDone(ch)) G.step = 'ch' + ch + 'end';
    } else if (ret.type === 'roam') {
      G.roam = G.roam.filter(g => g.id !== ret.id); G.flags['roamKills'] = (G.flags.roamKills || 0) + 1;
      // the army stands on the place where it met the group: run that place's arrival (town event, shrine) back on the map
      const n = ret.moveTo && WORLD.nodes[ret.moveTo];
      if (n && ((n.ev && !G.visited[ret.moveTo]) || n.t === 'shrine')) G.pendingArrive = { a: army, id: ret.moveTo };
    }
    else if (ret.type === 'dungeon') { if (G.dungeon && ret.room) { G.flags['dg.' + G.dungeon.id + '.' + ret.room] = true; if (ret.item) { inv.items.push(ret.item); G.pendingMsg = `<span class="yel">${ITEM[ret.item].n}</span>を手に入れた！`; } } }
    if (typeof afterBattleFull === 'function') afterBattleFull(B, ret, G);
    Game.save();
    Game.run();
  },

      `<canvas data-spr="${c.sp}|${u.side || 'P'}|${u.hair}" style="width:64px;height:64px;image-rendering:pixelated"></canvas>`;
    const capOf = k => R.cap(u, k);

      const next = (c.spells || []).filter(([, lv]) => lv > u.lv).map(([id, lv]) => `${SPELL[id].n}(Lv${lv})`).join('、');

    UI.modal(`<div class="row" style="flex-wrap:nowrap;align-items:flex-start">${por}<div class="grow"><h3 style="margin:0">${U.esc(u.n)}</h3>
      <div class="small">${c.n}　Lv${u.lv}${u.side === 'E' ? '' : '　EXP ' + (u.exp || 0) + '/100'}</div>
      <div class="small">HP ${inBattle ? u.hp + '/' : ''}${u.mhp}　移動${R.mov(u)}（${MTN[c.mt]}）</div></div></div>${desc}
      <div style="margin-top:6px">${SK.map(bar).join('')}</div>
      <h4 class="yel" style="margin:8px 0 2px;font-weight:normal">武器・魔法</h4>${wpn}
      <h4 class="yel" style="margin:8px 0 2px;font-weight:normal">持ち物</h4>${it}${promo}
      <div class="row end" style="margin-top:8px"><button class="btn y" data-a="ok">とじる</button></div>`, { ok: (d, b, m) => m.close() });
  },
  settings() {

  help() {
    UI.modal(`<div class="help"><h3>遊び方</h3>
      <h4>目的</h4><p>カイの隊とリセの隊、ふたつの部隊を動かして、霧に包まれた半島の南「白の大灯台」を目指します。</p>
      <h4>地図</h4><ul><li>下のボタンで隊を切り替え、つながった場所をタップして進みます。</li><li>赤い丸（剣のしるし）の場所は戦闘。村や町を訪ねると、仲間や道具が手に入ることも。</li><li>赤い魔物の群れは日がたつと近づいてきます。ぶつかると戦闘です。</li><li>迷宮の中を進むと、魔物と出会うことがあります（経験値かせぎにも）。</li></ul>

      <h4>成長</h4><ul><li>戦うと経験値がたまり、100でレベルアップ。</li><li>Lv10以上（村人はLv3以上）になったら「灯の祠」で祈ると、上のクラスに目覚めます。${EDITION === 'trial' ? '（体験版では、村人の転職だけができます）' : ''}</li><li>持ち物はひとり1つ。地図の「持ち物」から付け替えられます。武器は壊れません。</li></ul>

      <div class="row end"><button class="btn y" data-a="ok">とじる</button></div></div>`, { ok: (d, b, m) => m.close() });
  },
  // ---------- world-side actions ----------
  shrine(nodeId, army) {
    const G = Game.G;
    const node = WORLD.nodes[nodeId] || {};
    const units = Game.armyUnits(army);
    // the trial only has the villager's change of class; the upper classes come with the full edition
    const locked = EDITION === 'trial' ? units.filter(u => CLS[u.cls].promo && !CLS[u.cls].change && u.lv >= CLS[u.cls].plv) : [];
    const can = units.filter(u => CLS[u.cls].promo && u.lv >= CLS[u.cls].plv && !locked.includes(u));
    const fallen = G.fallen.filter(id => G.units[id] && !G.units[id].alive && (G.units[id].army === army || army === 'AB'));
    const revUsed = G.flags['rev.' + nodeId];
    const html = `<h3>${U.esc(node.n || '灯の祠')}</h3><p>灯の祠。小さな炎が、霧の中でも消えずに揺れている。</p>
      <div class="list"><button class="btn y" data-a="cc" ${can.length ? '' : 'disabled'}>祈る（クラスチェンジ）${can.length ? '' : '<br><span class="small">いまは目覚められる仲間がいない（Lv' + '10、村人はLv3から）</span>'}</button>
      ${G.mode === 'classic' ? `<button class="btn" data-a="rev" ${fallen.length && !revUsed ? '' : 'disabled'}>倒れた仲間を呼び戻す${revUsed ? '（この祠ではもう使った）' : fallen.length ? '' : '（いない）'}</button>` : ''}
      <button class="btn" data-a="bye">立ち去る</button></div>${locked.length ? '<p class="small dim">上級クラスへの目覚め（Lv10から）は、完全版で遊べます。</p>' : ''}`;
    UI.modal(html, {
      cc: async (d, b, m) => {
        m.close();
        const u = await UI.choose('だれが祈る？', can.map(v => ({ t: `${v.n}　${CLS[v.cls].n} Lv${v.lv}`, v })));
        if (!u) return Game.shrine(nodeId, army);
        const opts = CLS[u.cls].promo;
        let to = opts[0];
        if (opts.length > 1) {
          to = await UI.choose(`${u.n}は何になる？`, opts.map(p => ({ t: CLS[p].n, d: Game.classDesc(p), v: p })));
          if (!to) return Game.shrine(nodeId, army);
        }
        if (!(await UI.confirm(`${U.esc(u.n)}を「${CLS[to].n}」に${CLS[u.cls].change ? '転職' : 'クラスチェンジ'}させますか？${CLS[u.cls].change ? '' : '<br><span class="small dim">レベルは1に戻りますが、能力はそのままで、クラスの分だけ上がります。</span>'}`))) return Game.shrine(nodeId, army);
        const g = R.promote(u, to);
        if (u.item && !R.canItemFit(u, u.item)) { G.inv[army === 'AB' ? 'A' : army].items.push(u.item); u.item = null; }
        Snd.sfx('lvup');
        await UI.alert(`<span class="yel">${U.esc(u.n)}は「${CLS[to].n}」に目覚めた！</span><br>${Object.keys(g).map(k => SN[k] + '+' + g[k]).join('　') || ''}`);
        Game.save();
        Game.shrine(nodeId, army);
      },
      rev: async (d, b, m) => {
        m.close();
        const id = await UI.choose('だれを呼び戻す？', fallen.map(f => ({ t: G.units[f].n, v: f })));
        if (!id || Game.G !== G) return;
        if (G.flags['rev.' + nodeId] || G.units[id].alive) return Game.shrine(nodeId, army);
        G.units[id].alive = true;
        G.fallen = G.fallen.filter(f => f !== id);
        G.flags['rev.' + nodeId] = true;
        Snd.sfx('heal');
        await UI.alert(`祠の灯が強く輝き……${U.esc(G.units[id].n)}が戻ってきた！`);
        Game.save();
        Game.shrine(nodeId, army);
      },
      bye: (d, b, m) => m.close(),
    });
  },

const Icon = {
  cache: new Map(),
  get(k) {
    if (Icon.cache.has(k)) return Icon.cache.get(k);
    const rows = ICONS[k] || ICONS.path;
    const W = 14, H = 13;
    const g = [];
    for (let y = 0; y < H; y++) g.push(new Array(W).fill('.'));
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] !== '.') g[y + 2][x + 1] = r[x]; });
    const out = g.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (g[y][x] !== '.') continue;
      const n = (yy, xx) => yy >= 0 && yy < H && xx >= 0 && xx < W && g[yy][xx] !== '.';
      if (n(y - 1, x) || n(y + 1, x) || n(y, x - 1) || n(y, x + 1)) out[y][x] = 'k';
    }
    const c = SP.canvas(W, H), x = c.getContext('2d');
    const img = x.createImageData(W, H);
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
      const ch = out[y][xx]; if (ch === '.') continue;
      const [r, gg, b] = SP.rgb(PAL[ch] || '#f0f'); const i = (y * W + xx) * 4;
      img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    Icon.cache.set(k, c);
    return c;
  },
};

    if (this.kind === 'world') {
      this.cs = Math.max(8, View.W / d.w);

      this.maxY = Math.max(0, mapH - View.H);

      if (center) { const n = d.nodes[this.here(this.army)]; this.cam.y = U.clamp(n.y * this.cs - View.H * 0.45, 0, this.maxY); this.cam.x = 0; }

    } else {
      this.cs = Math.min(View.W / d.w, View.H / d.h);
      this.cam.x = -(View.W - d.w * this.cs) / 2; this.cam.y = -(View.H - d.h * this.cs) / 2;

  // ---------- static images ----------
  worldImg() {
    if (NodeMap._wimg) return NodeMap._wimg;
    const g = WORLD.build(), W = WORLD.w, H = WORLD.h, S = 8;
    const c = SP.canvas(W * S, H * S), x = c.getContext('2d');
    const P = (col, a, b, w = 1, h = 1) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
    const land = (xx, yy) => g[yy] && g[yy][xx] && g[yy][xx] !== '~';
    for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
      const ch = g[yy][xx], ox = xx * S, oy = yy * S, h = Tiles.hash(xx, yy, 3);
      if (ch === '~') {
        const near = land(xx - 1, yy) || land(xx + 1, yy) || land(xx, yy - 1) || land(xx, yy + 1);
        P(near ? '#3470c8' : '#2a5ab4', ox, oy, S, S);
        if (h % 5 === 0) P('#5a90e0', ox + (h % 5), oy + (h % 7), 3, 1);
        continue;
      }
      P(h % 3 ? '#5ca63e' : '#56a03a', ox, oy, S, S);
      if (h % 4 === 0) P('#78c058', ox + (h % 6), oy + (h % 5) + 1, 1, 1);
      if (!land(xx, yy - 1)) P('#e0cc90', ox, oy, S, 2);
      if (!land(xx, yy + 1)) P('#e0cc90', ox, oy + S - 2, S, 2);
      if (!land(xx - 1, yy)) P('#e0cc90', ox, oy, 2, S);
      if (!land(xx + 1, yy)) P('#e0cc90', ox + S - 2, oy, 2, S);
      if (ch === 'T') { for (const [tx, ty] of [[1, 1], [4, 3]]) { P('#5a3a1a', ox + tx + 1, oy + ty + 3, 1, 1); P('#226a2a', ox + tx, oy + ty, 3, 3); P('#3a8a3a', ox + tx, oy + ty, 2, 1); } }
      if (ch === '^' || ch === 'M') {
        const m = ch === 'M';
        for (let i = 0; i < 4; i++) P(m ? '#8a8a96' : '#9a7a48', ox + 3 - i, oy + 2 + i, 2 + i * 2, 1);
        for (let i = 0; i < 4; i++) P(m ? '#b8b8c4' : '#c09a60', ox + 3 - i, oy + 2 + i, 1 + i, 1);
        if (m) P('#ffffff', ox + 3, oy + 2, 2, 1);
        P(m ? '#5a5a66' : '#6a5030', ox, oy + 6, S, 1);
      }
    }

  dungeonImg(id) {

    const st = TILESTYLE[d.style] || TILESTYLE.cave;
    x.fillStyle = st.wall[1]; x.fillRect(0, 0, c.width, c.height);
    for (let yy = 0; yy < d.h * S; yy += 4) for (let xx = 0; xx < d.w * S; xx += 4) { const h = Tiles.hash(xx, yy, 5); if (h % 3 === 0) { x.fillStyle = h % 2 ? st.wall[0] : st.wall[2]; x.fillRect(xx, yy, 3, 2); } }
    x.lineCap = 'round';
    for (const [a, b] of d.edges) {
